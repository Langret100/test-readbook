/* ===============================================================
   국어 독해 | 기본 화면 스타일
   Decorative movement is short and transform/opacity only.

:root{
  --ink:#233949;--muted:#657886;--dark:#154b48;--accent:#147d79;
  --light:#edf8f3;--paper:#fffefb;--line:#e1e9e7;--cream:#f6f8f6;
  --warn:#936526;--bad:#b54e4f;--shadow:0 14px 32px rgba(22,65,69,.065);
  --mint:#c8f1de;--mint-strong:#43c6a4;--lilac:#eee9fd;--blue:#f0f5ff;
}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#f1f8f5 0,#f7f9f7 330px,#f7f8f6 100%);letter-spacing:-.012em}
::selection{background:#bcecd6;color:#154b48}
button, input{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #69bfb5;outline-offset:3px}
button{ -webkit-tap-highlight-color:transparent }
.site-header{height:79px;background:#fffefa;border-bottom:1px solid #e2ece8;box-shadow:0 3px 18px rgba(19,62,61,.025)}
.head-inner{max-width:1200px;padding:0 28px;gap:22px}
.brand{font-size:23px;letter-spacing:-.052em;gap:12px;transition:opacity .16s}
.brand:hover{opacity:.82}
.brand small{color:#6d8482;letter-spacing:0;margin-top:-2px;font-size:11px}
.brand-icon{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#0f6b60,#154943);box-shadow:inset 0 1px 0 #ffffff35,0 5px 11px #15594a25;position:relative}
.brand-icon:after{content:'';position:absolute;right:-3px;top:-3px;width:10px;height:10px;background:#fac884;border:3px solid #fffefa;border-radius:50%}
.head-inner nav{gap:2px;border:1px solid #e4ece7;border-radius:99px;padding:4px;background:#f5faf6}
.head-inner nav span{position:relative;font-size:12px;padding:8px 13px;letter-spacing:-.01em;color:#8a9b95;transition:background-color .18s,color .18s}
.head-inner nav span.nav-on{border-radius:99px;background:#176d62;color:#fff;box-shadow:0 3px 7px #176d6236}
.head-inner nav span.nav-done{color:#237b6d;font-weight:750}
.head-inner nav span.nav-done:before{content:'✓';margin-right:4px;color:#1b9778}
#historyBtn{border:1px solid #e0ebe5;white-space:nowrap}
main{max-width:1190px;padding:38px 24px 82px}
.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:850}
.hero{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;margin:12px 0 36px}
.hero-copy{background:linear-gradient(132deg,#154940 0%,#126d63 64%,#278b79 100%);border-radius:27px;padding:54px 46px 52px;box-shadow:0 14px 34px #145d521a;isolation:isolate}
.hero-copy:before{content:'';position:absolute;right:42px;bottom:-118px;width:245px;height:245px;border:1px solid #ffffff22;border-radius:50%;pointer-events:none}
.hero-copy:after{content:'가';position:absolute;font:340px Georgia,serif;right:-34px;top:-107px;color:#ffffff0c;pointer-events:none}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;color:#b9edd5;border:1px solid #ffffff30;background:#ffffff11;border-radius:99px;padding:8px 13px}
.hero .eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:#c3f3ce}
.hero h1{font-size:clamp(32px,3.6vw,48px);line-height:1.32;letter-spacing:-.063em;margin:29px 0 19px;position:relative;z-index:1}
.hero-copy p{font-size:15px;line-height:1.9;color:#deefea;margin:0 0 27px;position:relative;z-index:1}
.hero-copy .btn-row{position:relative;z-index:1}
.hero-card{background:linear-gradient(165deg,#fff6e9,#edf8f0 87%);border:1px solid #ebeadf;padding:27px 30px 23px;border-radius:27px;box-shadow:0 10px 28px #21473f0a;overflow:hidden;min-height:365px;gap:8px}
.hero-card .tag{display:inline-block;background:#f8e4cf;border-radius:99px;padding:6px 10px;color:#835c38;font-weight:800;font-size:11px}
.hero-card h2{font-size:25px;line-height:1.45;letter-spacing:-.06em;margin:10px 0 7px;color:#213f43}
.hero-card p{font-size:12px;line-height:1.75;color:#657974;margin:0;max-width:410px}
.hero-illustration{height:115px;position:relative;display:grid;place-items:center;margin:2px 0 6px}
.open-book{position:relative;display:flex;filter:drop-shadow(0 10px 8px #21514a2c);transform:rotate(-4deg);animation:bookArrive .7s cubic-bezier(.2,.7,.2,1) both}
.book-page{height:76px;width:109px;background:#fffefd;border:2px solid #b0d4c4;padding:17px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 -7px 0 #e8f1e8}
.book-page span{display:block;width:100%;height:5px;background:#d6e8dc;border-radius:10px}
.book-page span:nth-child(2){width:82%}.book-page span:nth-child(3){width:92%}.book-page span:nth-child(4){width:60%}
.left-page{border-radius:9px 2px 2px 14px;transform:skewY(-6deg);transform-origin:right center;background:#f6fbf6}
.right-page{border-radius:2px 9px 14px 2px;transform:skewY(6deg);transform-origin:left center}
.open-book:after{content:'';position:absolute;left:50%;top:5px;bottom:3px;width:4px;background:#74b8a5;transform:translateX(-50%);border-radius:4px}
.float-letter{position:absolute;display:grid;place-items:center;font-weight:900;border-radius:12px;box-shadow:0 4px 7px #21514a16;font-size:15px}
.letter-a{left:9%;top:14%;width:34px;height:34px;background:#ddd4fb;color:#68579a;transform:rotate(-11deg)}
.letter-b{right:9%;top:11%;width:31px;height:31px;background:#ffe1ba;color:#a37143;transform:rotate(13deg)}
.letter-c{right:21%;bottom:0;width:28px;height:28px;background:#bcebd7;color:#25745b;transform:rotate(-12deg)}
.stats-row{gap:9px}.stat{border-top:1px solid #cddfd4;padding-top:11px}.stat strong{font-size:27px;line-height:1.2;letter-spacing:-.04em}.stat span{font-size:11px}
.btn{border-radius:12px;padding:12px 18px;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease;position:relative}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 14px #1f685021}
.btn:active:not(:disabled){transform:translateY(0) scale(.985);box-shadow:none}
.btn-primary{background:linear-gradient(135deg,#167c72,#12665f);color:#fff;box-shadow:0 6px 12px #187b6524}
.btn-primary:hover{background:linear-gradient(135deg,#147267,#0e5b51)}
.btn-light{background:#fffdf8;border:1px solid #ffffffe0;color:#14574f;box-shadow:0 6px 16px #0d42352a}
.btn-large{padding:15px 23px;border-radius:13px}
.btn-outline{background:#fbfefb;border:1px solid #a9ccc2;color:#185e59}
.btn-outline:hover{background:#e9f7ef}
.btn-quiet{background:#eff5f1;color:#235653}
.btn-danger{background:#fff8f7;border-color:#f0d3d2}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 17px}
.section-heading .section-title{margin:6px 0 0}
.section-kicker{font-size:10px;color:#258b79;font-weight:900;letter-spacing:.16em}
.section-subtitle{font-size:12px;color:#87988f;white-space:nowrap}
.section-title{font-size:23px;letter-spacing:-.058em;color:#263f45;margin:31px 0 15px}
.grid3{gap:15px}
.feature{position:relative;overflow:hidden;min-height:155px;background:#fff;border:1px solid #e0eae6;box-shadow:0 6px 20px #174a4208;border-radius:18px;padding:23px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.feature:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:#49bba5;opacity:0;transition:opacity .18s}
.feature:hover{transform:translateY(-3px);box-shadow:0 10px 22px #174a4214;border-color:#c3e4d7}
.feature:hover:after{opacity:1}
.feature strong{color:#243e43;letter-spacing:-.03em;font-size:16px}
.feature p{line-height:1.8;font-size:12.5px;color:#637b7a}
.mini-icon{width:38px;height:38px;font-size:16px;font-weight:850;color:#177768;border-radius:13px;background:#e5f6ed;margin-bottom:12px}
.feature:nth-child(3n+2) .mini-icon{background:#eeeafd;color:#6e61a2}
.feature:nth-child(3n) .mini-icon{background:#fff1d9;color:#9a6833}
.panel,.tool-card,.question-card{background:#fff;border:1px solid #e0e9e6;box-shadow:0 8px 26px #1c575112}
.panel{border-radius:22px;padding:34px}
.panel-title{font-size:31px;line-height:1.3;letter-spacing:-.06em}
.sub{color:#677c81;line-height:1.85}
.two-col{grid-template-columns:minmax(0,1fr) 304px;gap:20px}
.field{color:#355453;font-size:13px}
.field input,.field select{border-radius:12px;background:#fbfdfb;min-height:48px;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:#4fbaaa;box-shadow:0 0 0 4px #67d4b520;outline:none}
.checkbox-line{padding:13px;border:1px solid #e7eee8;background:#f8fbf7;border-radius:12px;line-height:1.6}
.checkbox-line input{accent-color:#197f71;margin-top:4px;flex:none}
.note{background:#f0f7f3;border:1px solid #dcece3;border-radius:13px;color:#5a746d;line-height:1.85}
.step{padding:6px 0;margin:10px 0;gap:13px}
.step-n{border:0;background:linear-gradient(145deg,#d3efe0,#edf9f0);color:#21756a;border-radius:11px;width:34px;height:34px}
.pill{background:#e7f6ee;color:#187363;border-radius:99px;padding:7px 12px;letter-spacing:-.015em}
.pill-gray{background:#eef2f5;color:#627781}.pill-amber{background:#fff2d8;color:#845c20}
.reading-scroll-rail{height:4px;position:sticky;top:79px;z-index:18;background:#d9ebe4;pointer-events:none}
.reading-scroll-rail>div{height:100%;width:0%;background:linear-gradient(90deg,#43cda0,#198b7e);transition:width .16s linear}
.reader-head{margin-bottom:20px;align-items:center}
.reader-head h1{font-size:34px;color:#26434b;line-height:1.36;letter-spacing:-.063em}
.reader-paper{background:#fffefa;border:1px solid #e5ece7;border-radius:22px;position:relative;overflow:hidden;padding:47px clamp(26px,5vw,66px);box-shadow:0 15px 28px rgba(22,66,64,.065)}
.reader-paper:before{content:'';position:absolute;height:5px;left:0;right:0;top:0;background:linear-gradient(90deg,#85cdb7,#f3ce9e 52%,#c5b9e9)}
.reader-paper .passage-p{color:#2a3a42;line-height:2.15;letter-spacing:.005em}
.reader-paper .passage-p:not(:last-child){padding-bottom:18px;border-bottom:1px dashed #e4ebe6;margin-bottom:28px}
.reader-tools{top:100px;gap:12px}
.tool-card{position:relative;border-radius:17px;padding:20px 21px;overflow:hidden}
.tool-card h3{color:#315555;font-size:14px;font-weight:800}
.tool-icon{position:absolute;right:15px;top:10px;font-size:26px;font-weight:900;color:#b4dcd2;pointer-events:none}
.font-card .tool-icon{font-size:20px;color:#d5cbea}
.timer-card{background:#f2faf5;border-color:#d7eae1}
.timer-num{font-size:35px;font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:#1c7068}
.font-buttons button{background:#fff;border-color:#d6e9df;border-radius:11px;padding:9px 14px;font-weight:800;transition:background .15s,transform .15s}
.font-buttons button:hover{background:#daf1e5;transform:translateY(-1px)}
.quiz-layout{grid-template-columns:minmax(0,1fr) 283px;gap:20px}
.quiz-main{gap:15px}
.question-card{scroll-margin-top:113px;border-radius:18px;padding:25px 28px;transition:border-color .18s,box-shadow .18s}
.question-card.answered{border-color:#afdcca;box-shadow:0 7px 20px #27796312}
.question-top{margin-bottom:15px;color:#73848a}
.question-card h3{font-size:18px;line-height:1.72;letter-spacing:-.02em;margin-bottom:20px}
.option{background:#fff;border:1px solid #dce6e4;padding:13px 15px;border-radius:12px;gap:12px;transition:background .15s,border-color .15s,transform .15s}
.option:hover{background:#f2faf6;border-color:#a7d6c6}
.option:has(input:checked){background:#e8f8f0;border:2px solid #1e977c;padding:12px 14px;box-shadow:0 0 0 3px #6ccbab14}
.option input{width:17px;height:17px;accent-color:#1b8e78;margin-top:3px;flex:none}
.option span{font-size:14px;line-height:1.75}
.section-chip{background:#e9f6ee;color:#1c786b;border-radius:8px;font-weight:800;padding:5px 9px}
.sticky-actions{top:102px}
.answer-dashboard{background:linear-gradient(156deg,#fff,#f6fbf7);border-color:#d9e9df}
.answer-map-label{font-size:11px;color:#71847c;line-height:1.55;margin:0 0 12px}
.quiz-jumps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 19px}
.jump-dot{border:1px solid #d8e4dd;background:#fff;color:#61716c;border-radius:10px;min-width:0;height:37px;font-size:12px;font-weight:800;transition:background .16s,transform .16s,color .16s}
.jump-dot:hover{background:#e6f7eb;transform:translateY(-1px)}
.jump-dot.done{background:#197d6d;color:white;border-color:#197d6d}
.progress-rail{background:#e2ece9;border-radius:99px}
.progress-rail>div{background:linear-gradient(90deg,#56c998,#1b9684);border-radius:99px;transition:width .28s ease}
.result-panel{overflow:hidden}
.result-title{color:#24474b;font-size:35px;letter-spacing:-.055em}
.outcome-bar{background:linear-gradient(113deg,#edf9f2,#f6f9fb 65%,#f5f1fb);padding:21px 26px;border-radius:18px;border:1px solid #e0efe4;grid-template-columns:166px 1fr}
.score-circle{background:conic-gradient(#228b76 var(--pct),#dceee3 var(--pct));box-shadow:0 10px 22px #20736319;animation:scoreAppear .65s cubic-bezier(.2,.8,.25,1) both}
.score-circle:before{background:#fffefa;inset:13px}
.score-circle strong{font-weight:900;font-size:43px;letter-spacing:-.07em;color:#216d62}
.summary-grid{margin:21px 0 12px}
.summary-metric{border-radius:15px;background:#fff;border:1px solid #e3ede8;box-shadow:0 5px 17px #205c4d09}
.summary-metric strong{color:#217268;font-size:25px;letter-spacing:-.035em}
.summary-metric span{line-height:1.5;display:block;margin-top:6px}
.skill-row{grid-template-columns:145px minmax(0,1fr) 53px;gap:13px;margin:13px 0;color:#40605b}
.skill-track{height:10px;background:#e9f0eb}
.skill-track>span{background:linear-gradient(90deg,#89d3ad,#299c82);transform-origin:left;animation:growBar .65s ease-out both}
.report-guide{padding:13px 17px;border-radius:13px;background:#f6f5ff;border:1px solid #e8e5fa;font-size:13px;color:#685f86;margin:19px 0}
.help-card{border:1px solid #dfece3;background:#f7fbf7;border-radius:17px;padding:23px}
.help-card h3{color:#246d63}
.help-card li{line-height:1.75}
.answer-card{background:#fff;border-radius:14px;border-color:#e1eae4;padding:18px 21px}
.answer-card:has(.wrong){border-left:4px solid #e3ab7f}
.answer-card:has(.correct){border-left:4px solid #8ecfb1}
.camera-dock{border-radius:18px;border-color:#cfe6dc;box-shadow:0 11px 28px #143d3528;overflow:hidden}
.camera-head{font-size:12px;color:#245d58}
.cam-box{border-radius:11px;background:#213e3f}
.cam-face-guide{border:2px dashed #82dbb4;box-shadow:0 0 0 2px #133d372e}
.cam-advice{line-height:1.5}
.cam-stop{font-weight:750}
.calib-overlay{background:radial-gradient(circle at 50% 48%,#1e6e63 0,#173d3b 45%,#092b2d 100%)}
.calib-top{padding:15px 17px;border:1px solid #ffffff29;border-radius:15px;background:#ffffff0c}
.calib-dot{box-shadow:0 0 0 14px #48c78e23}
.calib-dot .dot-inner{box-shadow:0 0 6px #fff}
.toast{background:#173f3e;box-shadow:0 10px 30px #12453b4a;border:1px solid #368378;border-radius:13px}
.history-item h3{color:#24564f}
.footer{color:#91a19d;border-top:1px solid #e3ebe6;margin-top:35px;line-height:1.7}
@keyframes bookArrive{from{opacity:0;transform:translateY(11px) rotate(0deg) scale(.92)}to{opacity:1;transform:translateY(0) rotate(-4deg) scale(1)}}
@keyframes scoreAppear{from{opacity:.5;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@keyframes growBar{from{transform:scaleX(.05);opacity:.6}to{transform:scaleX(1);opacity:1}}
@keyframes stageReveal{from{opacity:.3;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
body[data-stage="home"] .hero,body[data-stage="setup"] main>.two-col,body[data-stage="quiz"] .reader-head,body[data-stage="result"] main>.result-panel,body[data-stage="history"] main>.panel{animation:stageReveal .38s ease-out both}
/* Read: no layout-transform animations, to preserve gaze coordinate measurement. */
body[data-stage="read"] .reader-head{animation:stageReveal .25s ease-out both}

/* Hero ghost button keeps white label legible against dark hero. */
.hero-copy #goHistory{background:#ffffff14;border-color:#ffffff85;color:#fff!important}

/* Clear reading-first interface: familiar controls, readable page, no decorative dashboards. */
:root{--ink:#222c2a;--muted:#697875;--dark:#193e36;--accent:#236b57;--light:#e8f3ed;--paper:#fff;--line:#dde5e0;--cream:#f5f7f4;--shadow:0 9px 28px rgba(32,64,50,.055)}
body{background:var(--cream);color:var(--ink)}
.site-header{height:68px;background:#fff;border-bottom:1px solid #e2e9e5;box-shadow:none;backdrop-filter:none}
.head-inner{max-width:1130px}
.brand{color:#203d34;letter-spacing:-.05em;font-size:19px;gap:10px}
.brand-icon{background:#234f40;color:#fff;width:39px;height:39px;border-radius:10px;font-size:24px;font-family:serif;box-shadow:none}
.brand small{font-size:10px;font-weight:500;letter-spacing:0;color:#83908a;line-height:1.5}
.head-inner nav{background:transparent;border:0;padding:0;gap:4px}
.head-inner nav span{font-size:12px;padding:7px 10px;border-radius:8px;color:#87918b}
.head-inner nav .nav-on{background:#e9f2ec;color:#245c45;box-shadow:none}
body[data-stage="home"] #stageNav,body[data-stage="setup"] #stageNav,body[data-stage="history"] #stageNav{visibility:hidden}
.header-actions{display:flex;align-items:center;gap:7px}
.sound-toggle,#historyBtn{border:1px solid #e0e8e2;background:#fff;color:#53665b;padding:8px 12px;border-radius:9px;box-shadow:none;font-size:12px}
.sound-toggle[aria-pressed="true"]{background:#e9f4ed;color:#23664b;border-color:#bee3c8}
main{max-width:1080px;padding:37px 22px 72px}
.btn{border-radius:10px;transition:background .15s ease,box-shadow .15s ease,transform .15s ease;box-shadow:none;font-weight:750}
.btn-primary{background:#20624e;border:1px solid #20624e;box-shadow:none;color:#fff}
.btn-primary:hover{background:#184d3e;box-shadow:none}
.btn-outline{color:#245743;border:1px solid #b8cdc0;background:#fff}
.btn-quiet{color:#43594c;background:#eff4ef;border:1px solid #e2ebe3}
.btn:focus-visible,.option:focus-within,.text-button:focus-visible,.jump-dot:focus-visible{outline:3px solid #9fc7b1;outline-offset:3px}
.btn-large{padding:15px 24px;font-size:16px;min-height:54px}
/* Welcome: two meaningful actions, no forms or tutorial cards */
.welcome{display:grid;grid-template-columns:1.08fr .92fr;min-height:410px;border:1px solid #dee7e0;border-radius:19px;background:#fff;overflow:hidden;box-shadow:var(--shadow);margin:20px 0 0}
.welcome-copy{padding:62px clamp(27px,4.6vw,68px) 52px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.welcome-label{font-size:13px;font-weight:800;color:#39765a;letter-spacing:-.01em}
.welcome h1{margin:16px 0 20px;font-size:clamp(31px,4.5vw,49px);letter-spacing:-.065em;line-height:1.26;color:#203e32;font-weight:820}
.welcome-copy>p:not(.welcome-hint){font-size:15px;color:#586961;line-height:1.95;margin:0 0 26px;word-break:keep-all}
.welcome-actions{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.welcome-actions .btn{white-space:nowrap}
.welcome-hint{font-size:12px;color:#74847d;margin:18px 0 0;line-height:1.7}
.welcome-picture{position:relative;min-height:390px;background:#d8e6d8;overflow:hidden}
.welcome-picture:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,43,25,.64),transparent 40%);pointer-events:none}
.welcome-picture img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.picture-caption{position:absolute;z-index:1;bottom:27px;left:28px;right:26px;color:white;display:flex;flex-direction:column;gap:3px;text-shadow:0 2px 5px #19351c70}
.picture-caption span{font-size:12px;opacity:.85}.picture-caption strong{font-size:17px;font-weight:650;letter-spacing:-.035em}
.welcome-bottom{display:flex;gap:15px;justify-content:center;color:#78857d;font-size:13px;padding:22px 0 0}
.dot-sep{color:#b2bfb4}
/* Camera check: one preview and one prominent next action. */
.setup-simple{max-width:755px;margin:13px auto 0;background:#fff;border:1px solid #dfe8e0;border-radius:18px;padding:34px 38px 30px;box-shadow:var(--shadow)}
.setup-top h1{font-size:28px;letter-spacing:-.048em;color:#203b31;margin:12px 0 5px;word-break:keep-all}
.setup-top p{color:#687b70;margin:0 0 18px;font-size:14px}
.setup-preview{min-height:245px}
body[data-stage="setup"] .camera-dock.camera-inline{position:relative;bottom:auto;right:auto;z-index:1;width:100%;padding:0;box-shadow:none;border:0;border-radius:0;opacity:1;background:transparent;overflow:visible}
body[data-stage="setup"] .camera-dock .camera-head{font-size:12px;margin:0 0 8px;color:#465e51}
body[data-stage="setup"] .camera-dock .cam-box{height:235px;max-height:40vh;background:#233831;border-radius:12px;box-shadow:0 3px 12px #1a39221d}
body[data-stage="setup"] .camera-dock .cam-advice{font-size:13px;margin:10px 0 3px;color:#2b6b4a}
body[data-stage="setup"] .camera-dock .cam-note{display:none}
body[data-stage="setup"] .camera-dock .cam-stop{font-size:12px;text-decoration:none;color:#777f7a}
.setup-status{font-size:13px;color:#496650;margin:12px 0 18px;line-height:1.6}
.setup-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.setup-controls .btn-quiet{font-size:12px}
.setup-quiet{font-size:12px;color:#89958d;line-height:1.7;margin:16px 0 9px}
.text-button{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;color:#51655b;font-size:13px;padding:7px 0}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important}
/* Reading and questions: flat textbook feel, no 'AI' dashboard garnish */
.panel{background:white;border:1px solid var(--line);box-shadow:var(--shadow)}
.reader-head h1{font-size:30px;color:#203e32;letter-spacing:-.05em;margin:7px 0}
.reader-head .sub{margin-bottom:4px}
.read-genre{display:inline-flex;font-size:12px;font-weight:800;color:#2b7052;background:#ecf5ed;padding:5px 10px;border-radius:7px}
.reader-paper{background:#fff;border:1px solid #e0e6e0;box-shadow:none;border-radius:14px}
.reader-paper::before{display:none}
.reader-paper .passage-p{font-size:19px;color:#27382e;line-height:2.1}
.reader-paper .passage-p:not(:last-child){border-color:#f1f1ec}
.reader-tools{gap:12px}
.tool-card{background:#fff;border:1px solid var(--line);box-shadow:none;padding:18px;border-radius:13px}
.timer-card{background:#eef5ee;border-color:#e0eadd}
.timer-num{color:#264d3d;font-size:28px;font-weight:750}
.tool-card h3{font-size:13px;color:#44564a}
.font-buttons button{min-width:63px;min-height:40px}
.reader-camera-card{background:#fff}
.reader-tools>.btn-primary{width:100%}
.question-card{border:1px solid var(--line);box-shadow:none;border-radius:13px;background:#fff;padding:25px 29px}
.question-card.answered{border-color:#a8cbb9;box-shadow:none}
.question-card h3{font-size:18px;color:#243a2d}
.question-top{color:#6a7c6e}
.section-chip,.pill{background:#eff5ee;color:#397253}
.option{border:1px solid #dce6de;border-radius:9px;background:#fff;transition:background .13s ease,border-color .13s ease}
.option:hover{background:#f5faf6;border-color:#afd1bc}
.option:has(input:checked){background:#eff8f1;border:2px solid #378569;box-shadow:none}
.option input{accent-color:#257753}
.answer-dashboard{background:#fff;border-color:var(--line)}
.jump-dot.done{background:#30765c;border-color:#30765c;color:white}

/* Results first: score -> errors -> practice; other data only on request */

.section-lead{font-size:13px;color:#7a877d;margin:0 0 14px}

.answer-card.is-wrong{border-left:3px solid #bb795a}
.answer-card.is-correct{border-left:3px solid #90b5a0}

.result-details{border-top:1px solid #e2ebe3;padding:0;margin-top:13px}

/* 100점: 점수 주변의 짧은 축하 강조와 가벼운 종이 꽃가루 */
.result-score.perfect-score{background:linear-gradient(135deg,#fdf5df,#f2f8e9);box-shadow:inset 0 0 0 1px #e9dcb5;animation:perfectScoreGlow 1.6s ease-out 1}
.result-score.perfect-score strong{color:#356747}
.perfect-banner{display:flex;align-items:center;gap:12px;border:1px solid #ead9a5;background:linear-gradient(95deg,#fff8e6,#f4f9e9);border-radius:13px;padding:13px 16px;margin:13px 0 17px;color:#465b3c;animation:perfectBannerIn .5s ease-out both}
.perfect-banner-mark{flex:none;display:grid;place-items:center;background:#ead9a5;color:#6d5626;font-family:serif;font-size:21px;font-weight:bold;width:37px;height:37px;border-radius:50%}

.celebration-layer{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden;contain:layout style paint}
.celebration-piece{position:absolute;left:var(--x);top:-20px;width:var(--w);height:var(--h);border-radius:2px;background:var(--c);opacity:0;will-change:transform;animation:confettiGlide var(--dur) cubic-bezier(.22,.5,.34,.97) var(--delay) both}
@keyframes confettiGlide{0%{opacity:0;transform:translate3d(0,-24px,0) rotate(0deg)}9%{opacity:.9}78%{opacity:.9}100%{opacity:0;transform:translate3d(var(--drift),105vh,0) rotate(var(--spin))}}
@keyframes perfectScoreGlow{0%{box-shadow:inset 0 0 0 1px #e9dcb5,0 0 0 0 rgba(208,165,84,.35)}35%{box-shadow:inset 0 0 0 1px #e9dcb5,0 0 0 12px rgba(208,165,84,.10)}100%{box-shadow:inset 0 0 0 1px #e9dcb5,0 0 0 0 rgba(208,165,84,0)}}
@keyframes perfectBannerIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.perfect-banner{gap:9px;padding:11px 12px}.perfect-banner strong{font-size:14px}.perfect-banner small{font-size:11px}}

body{background:#f6f8f8;color:var(--ink)}
.site-header{background:#fff;border-color:#e3e8ea}
main{max-width:1600px;width:100%;padding:24px clamp(12px,2.2vw,30px) 64px}
.head-inner{max-width:1600px;padding-inline:clamp(12px,2.2vw,30px)}
.reader-layout{grid-template-columns:minmax(0,1fr) 225px;gap:16px}
.reader-paper{padding:clamp(22px,3.4vw,50px);background:white;box-shadow:none;position:relative;border-radius:12px}
.reader-paper .passage-p{position:relative;font-size:19px;line-height:2.08;letter-spacing:0;word-break:keep-all;overflow-wrap:break-word;margin:0 0 26px;padding-left:24px}
.reader-paper .passage-p::before{content:attr(data-p);position:absolute;left:-1px;top:3px;font-size:12px;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#7a9793;font-weight:800}
.reader-paper .passage-p:first-child::before{content:'1'}
.reader-paper .passage-p[data-p="1"]::before{content:'2'}.reader-paper .passage-p[data-p="2"]::before{content:'3'}.reader-paper .passage-p[data-p="3"]::before{content:'4'}.reader-paper .passage-p[data-p="4"]::before{content:'5'}.reader-paper .passage-p[data-p="5"]::before{content:'6'}.reader-paper .passage-p[data-p="6"]::before{content:'7'}.reader-paper .passage-p[data-p="7"]::before{content:'8'}.reader-paper .passage-p[data-p="8"]::before{content:'9'}
.reader-paper .passage-p:not(:last-child){border:0;margin-bottom:26px;padding-bottom:0}
.reader-paper.line-guide-enabled::after{content:'';position:absolute;top:calc(var(--read-ruler-top, -100px) - var(--read-ruler-height, 34px)/2);left:12px;right:12px;height:var(--read-ruler-height, 34px);background:rgba(71,162,145,.105);border-top:1px solid rgba(48,134,118,.20);border-bottom:1px solid rgba(48,134,118,.20);border-radius:5px;pointer-events:none;z-index:2}
.guide-toggle{display:block;width:100%;margin-top:11px;padding:10px 9px;border:1px solid #cddbd8;border-radius:9px;background:#f7faf9;color:#335c56;font-weight:750;font-size:13px;transition:background .16s ease}
.guide-toggle[aria-pressed="true"]{background:#dff2ed;border-color:#5aa797}
.reader-tools{top:94px}.reader-tools .tool-card{padding:16px;background:#fff;border-radius:11px}.reader-tools .font-buttons button{flex:1;font-size:13px}
.reference-pane{top:91px}.assessment-workspace{grid-template-columns:minmax(0,1.13fr) minmax(0,1fr);gap:14px}
.reference-scroll{min-height:340px;max-height:calc(100dvh - 215px);padding:24px 28px}
.quiz-passage-p{border-radius:7px;padding:9px 12px;margin:0 0 14px;cursor:pointer;transition:background .17s ease,box-shadow .17s ease;position:relative}
.quiz-passage-p::before{content:attr(data-refpara);display:inline-block;margin-right:9px;color:#54837a;font-size:12px;font-weight:800}
.quiz-passage-p[data-refpara="0"]::before{content:'1'}.quiz-passage-p[data-refpara="1"]::before{content:'2'}.quiz-passage-p[data-refpara="2"]::before{content:'3'}.quiz-passage-p[data-refpara="3"]::before{content:'4'}.quiz-passage-p[data-refpara="4"]::before{content:'5'}.quiz-passage-p[data-refpara="5"]::before{content:'6'}.quiz-passage-p[data-refpara="6"]::before{content:'7'}.quiz-passage-p[data-refpara="7"]::before{content:'8'}
.quiz-passage-p:hover{background:#f6faf8}.quiz-passage-p.reader-marked{background:#e9f7ed;box-shadow:inset 3px 0 #5a9b7b}
.quiz-passage-p:focus-visible{outline:2px solid #2c8a79;outline-offset:2px}
.assessment-pane{padding:23px 25px}.question-card{padding:17px 2px;border:0;box-shadow:none;background:none}
.option{min-height:53px;border-radius:10px}
.option:has(input:checked){border-color:#2a816b;background:#eaf7f0}
.assessment-foot{margin-top:12px}
.result-panel{max-width:none}.insights{margin-top:20px}
.difficulty-summary{border:1px solid #dfe7e4;background:#fff;border-radius:13px;margin:17px 0 21px;padding:20px 22px}
.difficulty-header{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin:0 0 14px}.difficulty-header h2{font-size:18px;margin:0}.difficulty-header p{font-size:12px;color:#73817a;margin:0}
.difficulty-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.difficulty-item>div:first-child{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}.difficulty-item strong{font-size:14px;color:#314b44}.difficulty-item span{color:#74837b;font-size:12px}
.difficulty-rail{height:9px;background:#ebf0ed;border-radius:99px;overflow:hidden}.difficulty-rail i{display:block;height:100%;background:#408e78;border-radius:99px}
@media(max-width:1000px){.reader-layout{grid-template-columns:minmax(0,1fr) 205px}.assessment-workspace{grid-template-columns:1fr 1fr}.reference-scroll{padding:19px 19px}.assessment-pane{padding:18px}}
@media(max-width:740px){main{padding:13px 10px 58px}.reader-layout,.assessment-workspace{grid-template-columns:minmax(0,1fr)}.reader-paper{padding:21px 17px}.reader-paper .passage-p{padding-left:19px;font-size:17px!important;line-height:2}.reader-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.reader-tools .reader-camera-card,.reader-tools>.btn-primary{grid-column:1/-1}.reader-tools .tool-card{padding:12px}.reader-tools .font-card .font-buttons{gap:5px}.reader-tools .guide-toggle{font-size:12px;padding:9px 4px}.assessment-pane{padding:17px 15px}.quiz-passage-p{font-size:15px!important;line-height:1.8;padding:8px 9px}.difficulty-header{display:block}.difficulty-header h2{margin-bottom:5px}.difficulty-grid{gap:10px}}
@media(max-width:430px){.difficulty-summary{padding:15px}.difficulty-grid{grid-template-columns:1fr;gap:14px}.reader-paper{padding:18px 12px}.reader-paper .passage-p{padding-left:20px}.reader-tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.quiz-passage-p,.guide-toggle{transition:none!important}}
@media print{.guide-toggle{display:none}.reader-paper.line-guide-enabled::after{display:none}}

/* 조작 전용 보호: 모바일 터치 강조·길게 누르기 메뉴·실수로 발생하는 글자 선택 방지.
   지문 스크롤과 입력 필드의 편집, 키보드 포커스 표시는 유지한다. */
html,body{ -webkit-tap-highlight-color:transparent; }
body,body *:not(input):not(textarea):not([contenteditable]):not([contenteditable] *){
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button, a, label, .option, .jump-dot, [role="button"], [role="radio"], [role="tab"]{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
input:not([type="radio"]):not([type="checkbox"]),textarea,[contenteditable],[contenteditable] *{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
}
/* 포커스를 없애지 않고 키보드 사용자에게만 구분되게 표시. */
:where(button,a,label,[role="button"],[role="tab"],input):focus:not(:focus-visible){outline:none;}

window.READING_CONTENT=[{"id":"P01","title":"사라진 도서관 열쇠","genre":"이야기","paras":["비가 내리던 화요일 아침, 별빛초등학교 도서관 문이 열리지 않았다. 담당 선생님은 늘 창가 고리에 걸어 두던 열쇠가 없어진 것을 발견했다. 책 반납을 기다리던 아이들은 발을 동동 굴렀다. 도서부 민서는 어제 도서관을 마지막으로 나간 사람이 바로 자신이었다는 사실을 떠올렸다. 도서관 앞에는 비에 젖지 않으려고 처마 밑으로 몰려든 학생들이 줄을 서 있었다. 대출한 책을 돌려주어야 하는 학생도 있었고, 첫 교시 독서 활동에 쓸 책을 찾는 학생도 있었다. 민서는 작은 열쇠 하나가 여러 사람의 하루에 영향을 줄 수 있다는 사실을 처음 실감했다.","민서는 급하게 변명하는 대신 전날 일을 차례대로 되짚었다. 책 정리, 창문 닫기, 반납함 비우기, 불 끄기까지 기억났지만 열쇠를 건 순간은 떠오르지 않았다. 친구 준호는 “누군가 가져갔을 거야.”라고 말했다. 민서는 근거가 없는 짐작으로 다른 사람을 의심하고 싶지 않았다. 도서관의 물건은 여러 당번이 차례로 관리하므로, 한 사람의 기억에만 의지하면 작은 실수가 이어질 수 있었다. 민서는 어제 자신이 바빴다는 사실만 말하고 끝내면 문제의 원인을 알아낼 수 없다고 생각했다. 그래서 해야 할 일을 적어 둔 당번 수첩도 다시 펼쳐 보았다.","두 사람은 선생님과 함께 어제 사용한 물건과 장소를 살폈다. 반납함 아래에는 젖은 우산이 있었고, 책상에는 반납 도서 목록이 놓여 있었다. 준호는 물이 묻은 우산을 집어 들며 창가 쪽 바닥도 젖어 있었다고 말했다. 선생님은 물건이 원래 자리에서 없어졌다는 사실과 누군가 훔쳐 갔다는 판단은 다르다고 알려 주셨다. 세 사람은 먼저 확인할 수 있는 기록을 찾아보기로 했다. 민서는 목록 뒤쪽에서 작은 메모를 찾았다. “창가에서 물이 새어 열쇠를 임시로 안내 데스크 서랍에 보관함.”이라는 글이었다. 메모 아래에는 어제 당번인 민서의 이름이 적혀 있었다.","민서는 그제야 우산에서 떨어진 물이 열쇠 고리를 적시던 장면을 기억했다. 열쇠가 녹슬까 걱정되어 서랍에 넣고 메모까지 썼지만, 갑자기 울린 하교 방송 때문에 선생님께 알리지 못했던 것이다. 안내 데스크 서랍을 열자 열쇠가 그대로 있었다. 메모를 다시 읽은 민서는 당시 자신의 판단이 절반만 끝난 일이었다는 것을 깨달았다. 물건을 안전하게 옮겨 놓는 일과 다른 당번이 찾을 수 있도록 알리는 일은 하나로 이어져 있었다. 열쇠를 되찾자 기다리던 아이들의 표정도 서서히 밝아졌다. 민서는 안도하면서도 미안한 마음이 들었다.","도서관 문을 연 뒤 민서는 선생님과 친구들에게 자초지종을 설명하고 사과했다. 선생님은 “물건을 안전하게 옮긴 판단은 좋았지만 다음 사람이 알 수 있도록 전달하는 일까지 책임이란다.”라고 말했다. 그날부터 도서부는 열쇠 보관 위치를 기록하는 작은 인수인계판을 만들었다. 인수인계판에는 열쇠를 옮긴 날짜, 이유, 현재 위치, 확인한 사람을 적도록 했다. 새 규칙은 누구를 탓하기 위한 것이 아니라 같은 실수를 줄이기 위한 약속이었다. 민서는 다음 당번에게 직접 쓰는 방법을 보여 주면서 기록을 남기는 이유를 설명했다."],"questions":[{"id":"P01-01","q":"문이 열리지 않은 요일은?","options":["화요일","월요일","수요일","금요일"],"answer":0,"skill":"사실","p":0,"explanation":"첫 문장에 화요일 아침이라고 명시되어 있다.","level":1},{"id":"P01-02","q":"처음 열쇠를 걸어 두던 곳은?","options":["창가 고리","안내 데스크 서랍","반납 도서 목록 뒤","도서부 당번 수첩"],"answer":0,"skill":"사실","p":0,"explanation":"평소 열쇠 보관 장소는 창가 고리였다.","level":1},{"id":"P01-03","q":"민서가 떠올린 자신의 역할은?","options":["전날 마지막 퇴실자","전날 첫 등교자","다음 날 판이 등장하는 효과는?","options":["한 번의 사건이 앞으로의 공동 규칙으로 이어졌음을 보여 준다.","열쇠가 다시 사라질 것임을 미리 알려 준다.","민서가 더 이상 도서부 일을 하지 않게 됨을 강조한다.","준호의 도난 추측이 옳았음을 뒤늦게 증명한다."],"answer":0,"skill":"구조","p":4,"explanation":"사과에서 끝나지 않고 재발 방지 방법으로 이야기가 마무리된다.","level":3},{"id":"P01-30","q":"이 이야기의 주제를 다른 상황에 적용한 예로 가장 적절한 것은?","options":["공용 물품을 옮겼다면 위치를 기록하고 다음 이용자에게 알린다.","분실이 의심되면 사용자를 먼저 탓해 빨리 해결한다.","공용 물품은 불편해도 위치를 절대 바꾸지 않는다.","긴급한 조치를 했더라도 그 이유는 혼자만 기억한다."],"answer":0,"skill":"추론","p":4,"explanation":"물건을 안전하게 관리하는 행동과 정보를 공유하는 책임을 함께 강조한다.","level":3}]},{"id":"P02","title":"물 한 방울의 길","genre":"설명문","paras":["비가 내리면 숲의 흙은 물을 천천히 받아들인다. 그러나 아스팔트와 콘크리트가 많은 도시에서는 빗물이 땅속으로 스며들기 어렵다. 스며들지 못한 물은 도로 가장자리를 따라 빠르게 흘러간다. 같은 양의 비가 내려도 땅의 겉모습에 따라 물의 움직임은 달라진다. 낙엽이 쌓인 흙에서는 작은 틈으로 물이 들어가고, 나무뿌리 주변의 공간에도 일부가 머문다. 반면 단단하게 포장된 길에는 물이 머무를 틈이 적다. 이 차이는 비가 그친 뒤에도 땅이 얼마나 촉촉한지에서 드러난다. 그래서 짧은 시간에 비가 많이 오면 낮은 곳에 물이 몰릴 수 있다.","도시는 빗물이 흐를 길을 마련한다. 빗물받이는 길 위의 물을 모아 배수관으로 보내는 장치이다. 하지만 낙엽이나 쓰레기로 입구가 막히면 물이 잘 빠지지 않는다. 빗물받이는 평소 눈에 잘 띄지 않지만, 비가 세게 올 때 제 역할을 해야 하는 시설이다. 입구가 막히면 배수관이 멀쩡해도 물이 도로 위에 고일 수 있다. 다만 빗물받이를 직접 열거나 위험한 도로에 들어가는 일은 학생이 해서는 안 된다. 막힌 곳을 발견하면 어른이나 담당 기관에 알리는 편이 안전하다. 비가 올 때 빗물받이 위에 쓰레기를 버리지 않는 작은 행동이 도움이 된다.","최근에는 물을 무조건 빨리 보내는 대신 잠시 머물게 하는 방법도 활용한다. 빗물정원은 식물과 흙이 있는 낮은 공간으로, 빗물을 모아 조금씩 스며들게 한다. 물을 잠시 저장했다가 천천히 내보내는 저류 시설도 비슷한 목적을 가진다. 빗물정원에는 물에 잘 견디는 식물을 심고 흙 아래에 물이 지나갈 수 있는 층을 마련하기도 한다. 이런 공간은 평소에는 작은 화단처럼 보이지만, 비가 오는 날에는 주변 물의 일부를 받아 준다. 저류 시설은 큰비가 지난 뒤 천천히 물을 내보내므로 하천으로 들어가는 물의 양이 한순간에 급증하는 일을 줄이는 데 쓰인다. 두 시설은 물이 한꺼번에 몰리는 현상을 줄이는 데 도움을 준다.","빗물은 도시를 지나 하천으로 흘러간다. 이때 길에 쌓인 먼지나 오염 물질도 함께 이동할 수 있다. 따라서 빗물을 다루는 일은 침수만 막는 문제가 아니라 하천을 깨끗하게 지키는 일과도 이어진다. 비가 내린 뒤 도로의 먼지가 빗물과 함께 이동하는 것을 떠올려 보자. 거리에서 버려진 작은 플라스틱 조각이나 기름때도 물을 따라 다른 곳으로 옮겨질 수 있다. 그래서 도시의 물길은 건물과 도로의 문제일 뿐 아니라 주변 생물과 사람들이 함께 살아가는 환경의 문제이기도 하다. 쓰레기를 올바르게 버리고 주변 배수시설을 살피는 습관이 필요한 까닭이다.","그렇다고 어떤 시설 하나로 모든 비 피해를 막을 수 있는 것은 아니다. 비의 양과 지형, 시설의 관리 상태를 함께 살펴야 한다. 비가 매우 많이 내리거나 배수관이 오래되어 제 기능을 못하면 준비한 시설만으로는 부족할 수 있다. 그래서 도시에서는 위험한 장소를 미리 살피고, 시설을 정기적으로 관리하고, 필요한 경우 대피 안내도 한다. 시민은 쓰레기를 함부로 버리지 않고 침수된 길에 접근하지 않는 방식으로 참여할 수 있다. 도시가 할 일과 시민이 할 일을 나누어 실천하면, 비가 내리는 날의 위험을 조금씩 줄일 수 있다."],"questions":[{"id":"P02-01","q":"숲의 흙은 빗물을 어떻게 받아들이는가?","options":["천천히 스며들게 한다","땅 위로 모두 흘려보낸다","포장도로보다 빠르게 모은다","빗물받이로 곧장 보낸다"],"answer":0,"skill":"사실","p":0,"explanation":"흙은 물을 서서히 받아들인다.","level":1},{"id":"P02-02","q":"도시에서 물이 잘 스며들지 않는 주된 이유는?","options":["아스팔트와 콘크리트가 많기 때문","도시의 흙이 숲보다 단단해서","빗물받이가 모든 빗물을 모아서","모든 도로에 빗물정원이 있어서"],"answer":0,"skill":"사실","p":0,"explanation":"불투수성 포장이 땅속으로 스며듦을 줄인다.","level":1},{"id":"P02-03","q":"많은 비가 짧은 시간에 내리면 생길 수 있는 일은?","options":["낮은 곳에 물이 몰림","도로의 물이 모두 흙속으로 빠르게 스며듦","비가 내리기 전보다 낮은 곳이 더 건조해짐","빗물받이가 막혀도 도로에는 물이 고이지 않음"],"answer":0,"skill":"사실","p":0,"explanation":"빗물이 빠르게 흘러 낮은 곳으로 모일 수 있다.","level":1},{"id":"P02-04","q":"빗물받이의 역할은?","options":["도로의 물을 모아 배수관으로 보냄","물을 땅에 저장해 식물에만 공급함","빗물을 하천에서 다시 도로로 올림","포장도로를 흙으로 바꾸는 일을 함"],"answer":0,"skill":"사실","p":1,"explanation":"빗물받이는 길 위 물을 배수관으로 보낸다.","level":1},{"id":"P02-05","q":"빗물받이를 막는 예로 제시한 것은?","options":["낙엽과 쓰레기","배수관과 빗물정원","흙과 나무뿌리","빗물과 작은 돌"],"answer":0,"skill":"사실","p":1,"explanation":"입구가 낙엽이나 쓰레기에 막힐 수 있다.","level":1},{"id":"P02-06","q":"빗물받이를 돕는 시민 행동은?","options":["입구에 쓰레기를 버리지 않기","빗물받이 입구를 열어 직접 청소하기","빗물받이 위에 낙엽을 쌓아 두기","비가 심할 때 침수된 도로로 들어가기"],"answer":0,"skill":"사실","p":1,"explanation":"쓰레기를 버리지 않으면 물길이 막힐 위험을 줄일 수 있다.","level":1},{"id":"P02-07","q":"빗물정원의 특징으로 알맞은 것은?","options":["식물과 흙이 있는 낮은 공간","도로 가장자리의 콘크리트 도랑","높은 지붕에서만 물을 모으는 공간","물이 땅에 스며들지 못하도록 만든 바닥"],"answer":0,"skill":"사실","p":2,"explanation":"빗물정원은 식물과 흙으로 물을 스며들게 한다.","level":1},{"id":"P02-08","q":"저류 시설은 무엇을 하는가?","options":["물을 잠시 저장했다가 천천히 보냄","빗물을 바로 배수관으로만 보냄","도시로 들어오는 비 자체를 줄임","식물의 잎에만 빗물을 저장함"],"answer":0,"skill":"사실","p":2,"explanation":"저류 시설은 유출 시점을 늦추는 데 도움이 된다.","level":1},{"id":"P02-09","q":"빗물정원과 저류 시설의 공통 목적은?","options":["물이 한꺼번에 몰리는 현상을 줄임","빗물을 모두 마시는 물로 바꾸는 것","물길을 가능한 한 빠르게 만드는 것","비가 온 뒤 하천의 물을 완전히 없애는 것"],"answer":0,"skill":"사실", :"‘깨끗한 하천을 위해 쓰레기 처리도 중요하다’는 주장을 직접 뒷받침하는 내용은?","options":["길 위의 오염 물질이 빗물과 함께 하천으로 이동할 수 있다.","비가 오면 숲의 흙이 물을 천천히 받아들인다.","저류 시설은 물을 잠시 모아 두는 역할을 한다.","낮은 곳에는 비가 많이 내릴 때 물이 몰릴 수 있다."],"answer":0,"skill":"비판","p":3,"explanation":"4문단의 오염 물질 이동이 하천 환경과 쓰레기 관리의 연결 근거이다.","level":3},{"id":"P02-27","q":"이 글의 설명 흐름을 가장 잘 정리한 것은?","options":["도시에서 물이 몰리는 까닭 → 관리 시설 → 환경과 공동 실천","빗물 시설의 종류 → 학교 역사 → 도시 건설 방법","하천의 동물 소개 → 기상 관측 → 숲의 성장 과정","비 피해 사례 나열 → 개인의 여행 경험 → 교통 안내"],"answer":0,"skill":"구조","p":4,"explanation":"문제의 원인, 시설 대책, 시민 실천을 차례로 설명한다.","level":3},{"id":"P02-28","q":"빗물정원과 저류 시설 중 어느 것이 적절한지 결정할 때 글의 내용상 가장 필요한 정보는?","options":["지역의 지형과 물의 양, 시설을 관리할 수 있는 조건","시설을 이용하는 주민들이 선호하는 색깔","가장 널리 알려진 시설의 별명과 사진","비가 오지 않는 날 사람들이 걷는 속도"],"answer":0,"skill":"추론","p":2,"explanation":"마지막 문단에서 비의 양·지형·관리 상태 등 조건을 함께 살피라고 했다.","level":3},{"id":"P02-29","q":"비 피해를 줄이는 계획으로 글의 내용과 가장 잘 맞는 것은?","options":["배수구 관리와 물을 저장하는 시설을 지역 조건에 맞춰 함께 살핀다.","새 시설을 하나 설치하면 다른 준비는 모두 중단한다.","빗물은 언제나 빨리 내보내는 것이 좋으므로 저장 시설을 없앤다.","오염 물질 문제는 비와 무관하므로 하천 청소는 고려하지 않는다."],"answer":0,"skill":"비판","p":4,"explanation":"글은 하나의 대책보다 여러 조건과 관리 주체의 역할을 함께 강조한다.","level":3},{"id":"P02-30","q":"‘빗물정원을 설치한 뒤 침수 피해가 줄었다’는 평가를 더 믿을 만하게 하려면?","options":["설치 전후 강우량과 지형 등 조건을 비교해 살펴봐야 한다.","비가 오지 않는 날만 골라 사진을 찍으면 충분하다.","정원이 예쁘다는 평가가 많으면 침수 감소가 증명된다.","정원을 찾는 방문객 수가 늘었는지만 살펴보면 된다."],"answer":0,"skill":"비판","p":4,"explanation":"강우량 등 다른 조건을 고려하지 않으면 효과를 정확히 판단하기 어렵다.","level":3}]},{"id":"P03","title":"우리 학교 쉼터를 어떻게 만들까","genre":"주장하는 글","paras":["점심시간마다 운동장 옆 그늘에 학생들이 모인다. 앉을 자리는 적고, 비가 오면 쉴 곳도 마땅하지 않다. 학교는 다음 학기에 작은 쉼터를 만들 계획이다. 지금은 쉴 곳이 부족해 학생들이 화단 가장자리나 계단에 앉는 모습도 자주 보인다. 어떤 학생은 쉬는 시간에 조용한 곳을 찾지 못해 교실에 남아 있기도 한다. 쉼터를 만든다는 것은 단지 보기 좋은 시설을 세우는 문제가 아니라 누가 그 공간을 편안하고 안전하게 사용할 수 있는지 결정하는 일이다. 나는 쉼터를 정할 때 학생들의 의견을 충분히 들어야 한다고 생각한다.","첫째, 실제로 이용할 학생들이 불편한 점을 가장 잘 안다. 어떤 학생은 조용히 책을 읽고 싶어 하고, 다른 학생은 친구와 이야기를 나누고 싶어 한다. 설문조사와 학급회의를 하면 서로 다른 요구를 확인할 수 있다. 예를 들어 점심시간에 주로 무엇을 하는지 묻는 간단한 설문을 생각해 볼 수 있다. 책 읽기, 대화하기, 혼자 쉬기처럼 선택지를 마련하되 자유롭게 의견을 적을 칸도 두는 것이다. 설문에서 가장 많은 표를 얻었다고 다른 의견을 모두 무시해서는 안 된다. 이용자가 적더라도 꼭 필요한 공간이 있을 수 있기 때문이다. 의견을 모은 뒤 사용 목적에 따라 자리를 나누는 방법을 생각할 수 있다.","둘째, 편리함과 함께 안전과 접근성을 살펴야 한다. 휠체어가 지나갈 통로를 확보하고, 날카로운 모서리가 없는 가구를 선택해야 한다. 햇빛과 비를 피할 수 있는 지붕도 도움이 된다. 통로가 충분히 넓지 않으면 친구의 도움 없이는 들어가기 힘든 학생이 생길 수 있다. 비가 내리는 날 미끄러운 바닥이 되는지도 살펴야 하고, 쉬는 시간에 여러 학생이 한꺼번에 모일 때를 생각해야 한다. 이용하는 사람의 몸과 상황이 서로 다르다는 점을 고려해야 모두에게 열린 공간에 가까워진다. 예쁜 디자인만 보고 결정하면 일부 학생은 공간을 이용하기 어려울 수 있다.","물론 학생들의 의견을 모두 반영하기는 어렵다. 예산이 정해져 있고, 작은 공간에 많은 시설을 넣을 수도 없다. 그렇기 때문에 학생 대표, 선생님, 시설 담당자가 함께 우선순위를 정하는 자리가 필요하다. 예를 들어 지붕과 안전한 바닥은 꼭 필요하지만, 장식 조명은 뒤로 미룰 수 있다. 어떤 학생은 편의 시설을 늘리자고 할 것이고 다른 학생은 통로를 먼저 넓히자고 할 수도 있다. 이럴 때는 각 선택의 장점과 비용을 기록한 뒤 공통으로 중요한 기준을 정하면 다수 의견만 따를 때보다 납득하기 쉽다. 안전과 필수 이용 조건을 먼저 살핀 다음 남은 예산으로 편의 시설을 고르는 것이 합리적이다.","잘 만든 쉼터는 의자와 지붕만 있는 장소가 아니다. 서로 다른 사람이 편안하게 쉬고, 함께 정한 약속을 지키는 공간이어야 한다. 완성된 뒤에도 학생들이 이용해 본 느낌을 조사해 의자 배치나 사용 규칙을 고칠 수 있다. 처음부터 모든 것을 완벽하게 정하기보다 사용자의 목소리를 듣고 조금씩 개선하는 것이 실제 생활에 맞는 방법이다. 학생들의 참여가 공간에 대한 책임감으로 이어지도록 하는 일도 학교가 함께 고민해야 한다. 쉼터를 만드는 과정부터 학생들이 참여한다면 완성된 공간을 더 소중하게 사용할 것이다."],"questions":[{"id":"P03-01","q":"글쓴이가 주장하는 핵심은?","options":["쉼터를 만들 때 학생 의견을 충분히 듣자","학생 설문 없이 시설부터 설치하자","쉼터의 장식 조명을 가장 먼저 정하자","다수 학생이 원하는 용도로만 만들자"],"answer":0,"skill":"구조","p":0,"explanation":"첫 문단 끝에 중심 주장이 나온다.","level":1},{"id":"P03-02","q":"학교가 쉼터를 만들 계획인 시기는?","options":["다음 학기","이번 학기 말","다음 학년도 겨울방학","이번 주말"],"answer":0,"skill":"사실","p":0,"explanation":"다음 학기에 쉼터를 만들 계획이라고 했다.","level":1},{"id":"P03-03","q":"현재 학생들이 겪는 불편은?","options":["앉을 자리와 비 피할 곳이 부족함","조용히 책 읽을 장소만 너무 많음","쉼터 이용 인원이 너무 적음","학생마다 이용하려는 목적이 완전히 같음"],"answer":0,"skill":"사실","p":0,"explanation":"자리 부족과 비를 피할 곳이 없다는 문제가 있다.","level":1},{"id":"P03-04","q":"학생 의견을 들어야 할 첫 번째 근거는?","options":["실제 이용자가 불편을 잘 알기 때문","교직원이 시설 관리에 참여하지 않아도 되기 때문","새 시설을 만들면 모든 의견이 일치하기 때문","다수 학생의 선택이면 안전 검사가 필요 없기 때문"],"answer":0,"skill":"사실","p":1,"explanation":"이용자의 경험을 반영해야 한다는 근거이다.","level":1},{"id":"P03-05","q":"다른 요구를 파악하는 방법으로 제안한 것은?","options": 유형별 이용 편의·안전과 설문에서 나온 요구가 반영됐는지 확인한다.","처음 제안한 장식과 최종 색상이 같은지만 확인한다.","시설 공사가 가장 빨리 끝난 날이 언제인지 확인한다.","쉼터 사진을 본 사람의 수만 조사한다."],"answer":0,"skill":"비판","p":4,"explanation":"이용자 의견·안전·접근성이 핵심이므로 실제 사용 경험을 조사해야 한다.","level":3}]},{"id":"P04","title":"소식을 공유하기 전에","genre":"설명문","paras":["우리 반 온라인 게시판에 “내일부터 모든 학교가 일주일 동안 쉰다”라는 글이 올라왔다. 놀란 학생들은 곧바로 친구에게 전하려 했다. 하지만 글에는 누가 언제 발표했는지 적혀 있지 않았다. 그 문장만 보면 다음 날 가방을 챙기지 않아도 될 것처럼 느껴졌다. 몇몇 학생은 부모님에게도 이 소식을 말하려 했지만, 다른 학생은 자기 지역 학교에도 해당하는지 의문을 품었다. 내용이 구체적인 날짜를 말하고 있어도 출처가 없으면 사실인지 알 수 없다는 점이 문제였다. 담임 선생님은 “소식이 놀라울수록 보내기 전에 확인하는 시간이 필요해요.”라고 말했다.","정보를 확인하는 첫 번째 방법은 출처를 살피는 것이다. 글쓴이가 누구인지, 학교나 교육청처럼 책임 있는 기관의 발표인지 알아본다. 출처가 모호한 익명 게시물은 사실이라고 곧바로 믿지 않는다. 공식 기관처럼 보이는 이름이나 그림이 있다고 해도 글 자체의 출처를 확인해야 한다. 화면을 캡처한 사진은 원래 글에서 떨어져 나온 것일 수 있고, 이름만 비슷한 계정도 있을 수 있다. 가능한 경우 기관의 공식 안내 페이지에서 같은 내용이 실제로 공지되었는지 확인하는 것이 더 정확하다. 같은 말이 여러 곳에 퍼졌다는 사실만으로 참이라고 판단해서도 안 된다.","두 번째는 날짜와 맥락을 확인하는 것이다. 오래전에 있었던 일을 지금 일어난 것처럼 소개할 수도 있고, 긴 글에서 일부 문장만 잘라 뜻을 바꿀 수도 있다. 예를 들어 작년에 폭설 때문에 휴업했다는 안내가 날짜 없이 돌아다니면 올해의 새 공지로 오해하기 쉽다. ‘일부 학교’라는 표현을 뺀 채 ‘모든 학교’라고 전달해도 원래 의미가 달라진다. 한 문장만 떼어 읽지 않고 앞뒤 설명을 함께 확인하는 습관이 필요한 이유가 여기에 있다. 원래 글의 전체 내용과 작성 날짜를 함께 읽으면 오해를 줄일 수 있다.","세 번째는 서로 독립적인 자료를 비교하는 것이다. 한 게시물의 내용을 그대로 베낀 글 여러 개는 별개의 증거가 아니다. 서로 다른 책임 있는 자료가 같은 사실을 뒷받침하는지 살펴야 한다. 여러 사람이 같은 사진을 올렸더라도 모두 하나의 게시물에서 복사했을 수 있다. 이런 경우에는 게시물의 개수가 많아졌을 뿐 서로 다른 근거가 늘어난 것은 아니다. 학교 알림장과 교육청 공지처럼 작성 주체가 다른 자료를 비교하면 주장의 사실 여부를 더 신중하게 판단할 수 있다. 확실하지 않다면 친구들에게 단정적으로 전달하지 않는 편이 좋다.","나중에 그 게시판 글은 다른 지역에서 몇 년 전 있었던 휴업 안내를 잘못 옮긴 것으로 밝혀졌다. 최초로 공유한 학생은 사실을 바로잡는 글을 올리고 미안하다고 말했다. 처음 게시한 학생을 무조건 비난하는 대신 왜 틀렸는지 함께 확인하는 과정도 필요하다. 누군가가 이미 잘못된 소식을 전달받았을 수 있으므로 정정 글에는 무엇이 사실과 다른지 분명히 적어야 한다. 잘못을 인정하고 바로잡는 행동은 다음에 정보를 공유할 때 서로를 더 믿을 수 있게 해 준다. 잘못된 정보를 전하지 않는 것도 중요하지만, 틀린 것을 알았을 때 빠르게 고치는 태도도 책임 있는 소통이다."],"questions":[{"id":"P04-01","q":"게시판에 올라온 소문의 내용은?","options":["모든 학교가 일주일 쉰다는 글","일부 학교에서 올해 새 학기만 연기한다는 글","지난주 우리 학교가 하루 쉬었다는 글","다른 지역 학교가 폭설로 하루 쉬었다는 글"],"answer":0,"skill":"사실","p":0,"explanation":" .","새로운 시험 문제를 해결하는 방법을 소개한다.","아침 풍경이 실제로 겨울 풍경과 같았다고 설명한다."],"answer":0,"skill":"구조","p":4,"explanation":"마지막에는 빈 가지에서도 더 넓은 하늘을 발견하는 태도로 나아간다.","level":3},{"id":"P05-25","q":"‘빈 가지 사이로 / 더 넓은 하늘이 보일 테니까’에 담긴 생각은?","options":["무언가 줄어든 자리에서도 새로운 가능성을 볼 수 있다.","가지가 비면 나무의 가치도 완전히 사라진다.","하늘은 여름보다 겨울에 항상 더 커진다.","빈 가지가 생기면 반드시 슬픈 일만 일어난다."],"answer":0,"skill":"추론","p":4,"explanation":"비어 있는 모습에도 긍정적인 의미를 찾는 태도이다.","level":3},{"id":"P05-26","q":"바람과 잎사귀의 모습을 ‘두드리면’과 ‘대답한다’로 표현한 까닭은?","options":["자연이 서로 이야기를 주고받는 듯한 친밀감을 느끼게 하려고","바람이 실제 사람의 목소리로 말을 한다는 정보를 주려고","나뭇잎에 적힌 글씨를 읽었다고 알리려고","바람의 세기를 수치로 비교하려고"],"answer":0,"skill":"표현","p":1,"explanation":"사람의 행동을 자연에 빗댄 의인화로 정감 있는 분위기를 만든다.","level":3},{"id":"P05-27","q":"이 시를 ‘시험을 포기하라는 시’라고만 해석하기 어려운 이유는?","options":["시험지를 잠시 접고 여유를 배우는 것이지 공부를 버린다는 말은 없기 때문이다.","화자가 시험지에 높은 점수를 적어 두었다고 밝혔기 때문이다.","나무가 학교 교실 밖으로 도망간다고 쓰여 있기 때문이다.","마지막 연에서 시험을 다시 치른다고 직접 말하기 때문이다."],"answer":0,"skill":"비판","p":3,"explanation":"4연에서는 시험지를 잠시 접어 두지만 “내일은 다시 차근차근 풀어 볼 것이다”라고 한다. 이는 공부를 포기하는 것과 다르다.","level":3},{"id":"P05-28","q":"물방울이 작은데도 ‘하늘을 품는다’고 한 표현에서 느낄 수 있는 생각은?","options":["작고 평범한 대상에도 넓은 세계를 발견할 수 있다.","커다란 대상만 아름다움을 표현할 수 있다.","하늘은 나무보다 작다는 사실을 강조한다.","물방울에는 아무것도 비치지 않는다고 말한다."],"answer":0,"skill":"추론","p":2,"explanation":"작은 물방울 속에 넓은 하늘이 비치는 대비가 중심이다.","level":3},{"id":"P05-29","q":"시에서 화자가 나무를 통해 얻은 깨달음을 가장 직접적으로 밝히는 부분은?","options":["시험지를 접고 나무에게 서두르지 않는 법을 배우는 부분","나무가 책상에 그림자를 드리우는 부분","잎사귀가 바람에 움직이는 부분","빗방울이 나뭇가지에 매달린 부분"],"answer":0,"skill":"구조","p":3,"explanation":"2연에서도 서두르지 않는 마음이 나타나지만, 4연의 “서두르지 않는 법을 배운다”에서 깨달음이 가장 직접적으로 드러난다.","level":3},{"id":"P05-30","q":"이 시를 한 문장으로 감상한 말 가운데 작품의 여러 표현을 가장 잘 엮은 것은?","options":["나무의 작은 변화들이 마음의 여유와 새로운 시선을 일깨워 준다.","화자는 바람이 분 날에만 나무를 좋아한다.","계절에 따라 나무가 자라는 속도를 계산하는 시이다.","나무가 학교 생활을 방해하므로 창가를 피해야 한다."],"answer":0,"skill":"표현","p":4,"explanation":"의인화된 나무, 거울 같은 물방울, 빈 가지를 통한 마음의 변화를 종합한 감상이다.","level":3}]},{"id":"P06","title":"밤에 불이 켜진 교실","genre":"인물 이야기","paras":["작은 마을의 회관에는 저녁마다 불이 켜졌다. 낮에는 생업을 이어 가느라 글을 배울 시간이 없었던 어른들이 모여 한글을 익히는 교실이었다. 수업을 맡은 은하 선생님은 스스로 자신의 이름을 쓰고 싶다는 어른들의 말을 듣고 이 수업을 시작했다. 회관 문 앞에는 일터에서 바로 온 사람들의 장화와 장바구니가 가지런히 놓여 있었다. 처음에는 자신의 실수를 남에게 보이기 부끄러워 뒤쪽 자리에 앉는 학생도 있었다. 그러나 은하 선생님은 글을 배우는 데 나이가 정해져 있지 않다고 말하며 누구나 질문할 수 있는 교실을 만들었다.","첫날에는 글씨를 따라 쓰는 일도 쉽지 않았다. 할머니 한 분은 “손이 굳어 펜이 말을 듣지 않아요.”라며 웃었다. 선생님은 글씨가 반듯한지보다 자기 생각을 글로 전하는 일이 더 중요하다고 말했다. 연필을 오래 잡지 않았던 사람에게는 획을 똑바로 긋는 일부터 새로운 도전이었다. 어떤 학생은 자음과 모음을 거꾸로 놓기도 했지만, 다른 학생들은 웃지 않고 기다려 주었다. 선생님은 짧은 문장이라도 자신이 전하고 싶은 말을 적어 보게 하면서 글씨 연습이 생활과 이어지도록 했다. 학생들은 서로의 속도를 기다리며 연습했다.","한 달 뒤 수업에서는 시장에서 본 안내문을 읽었다. 어떤 글자는 비슷하게 생겨 헷갈렸고, 띄어쓰기가 없어 뜻을 파악하기 어려운 문장도 있었다. 선생님은 단어를 소리 내어 읽고, 문장을 의미에 따라 끊어 읽는 연습을 했다. 가게 문에 붙은 안내문과 버스 시간표는 교실 밖에서 바로 만나는 글이었다. 선생님은 비슷한 글자 때문에 뜻이 달라지는 예를 보여 주고, 어른들은 서로 읽은 내용을 확인했다. 글자를 소리 내는 것과 문장의 뜻을 이해하는 것은 같은 일이 아니라는 점도 차츰 깨달았다. 어려운 문장은 생활에서 경험한 일에 연결해 설명했다.","어느 날 수업이 끝날 무렵, 할머니 한 분이 손자에게 보낼 짧은 편지를 쓰기 시작했다. 종이 위에 글자가 늘어날 때마다 펜을 멈추고 마음을 어떻게 표현할지 생각했다. 누군가 대신 써 주면 더 빨랐겠지만, 할머니는 자신의 마음을 직접 전하고 싶었다. 선생님은 편지를 대신 써 주지 않고 필요한 글자만 옆에서 알려 주었다. 마침내 할머니는 “오늘 네가 만든 종이배를 생각했단다.”라는 문장을 포함한 편지를 완성했다. 글씨는 조금 삐뚤었지만 직접 쓴 문장이었다. 할머니는 틀린 글자가 없는지 확인한 뒤 편지를 여러 번 읽으며 얼굴을 붉혔다.","겨울이 되자 회관 게시판에는 학생들이 쓴 메모가 늘었다. 장을 보는 목록, 이웃에게 전하는 인사, 책에서 마음에 남은 구절이 붙었다. 어떤 메모에는 물건을 사야 한다는 실용적인 내용이, 다른 메모에는 오랫동안 말하지 못했던 고마움이 담겼다. 교실에서 배운 글자가 집과 시장과 이웃의 생활로 조금씩 옮겨 간 것이다. 은하 선생님은 학생들이 서로의 글을 읽고 미소 짓는 모습을 보며 배움의 변화를 느꼈다. 글을 배운다는 것이 시험에서 높은 점수를 받는 것만은 아니라는 사실도 다시 깨달았다. 글은 사람과 사람의 마음을 이어 주는 길이 될 수 있었다."],"questions":[{"id":"P06-01","q":"저녁 교실이 열린 곳은?","options":["마을 회관","작은도서관","학교 도서실","시장 안내소"],"answer":0,"skill":"사실","p":0,"explanation":"마을 회관에서 수업이 열렸다.","level":1},{"id":"P06-02","q":"학생들이 낮에 수업에 오기 어려웠던 이유는?","options":["일을 해야 했기 때문에","저녁에는 일을 하기 때문","글자를 이미 모두 알고 있기 때문","교실이 낮에만 열리기 때문"],"answer":0,"skill":"사실","p":0,"explanation":"낮에는 생업 때문에 시간이 없었다.","level":1},{"id":"P06-03","q":"수업을 시작하게 된 계기는?","options":["자기 이름을 쓰고 싶다는 어른들의 바람","마을에서 시험 대회를 열기 위해","생활 안내문을 만드는 사람을 늘리기 위해","겨울 게시판의 메모를 전시하기 위해"],"answ 생활을 위해 해야 하는 일","수업 뒤에 읽는 책의 제목","교실에서 따라 쓰는 자음 순서","겨울 게시판에 붙인 문장의 길이"],"answer":0,"skill":"어휘","p":4,"explanation":"생업은 생활을 꾸려 가기 위해 하는 일을 뜻한다. 첫 문단은 낮에 일을 해야 해서 글 배울 시간이 부족한 어른들이 저녁 교실에 모였다고 설명한다.","level":3},{"id":"P06-23","q":"선생님이 편지 전체를 대신 써 주지 않은 이유는?","options":["학생이 스스로 마음을 글로 표현하는 경험이 중요했기 때문이다.","글씨가 삐뚤면 편지를 보내지 못하기 때문이다.","할머니가 이미 모든 글자를 정확하게 알고 있었기 때문이다.","선생님은 편지 내용을 이해할 필요가 없다고 생각했기 때문이다."],"answer":0,"skill":"추론","p":3,"explanation":"선생님은 필요한 글자만 도와 주어 스스로 완성하게 했다.","level":3},{"id":"P06-24","q":"첫 문단에 ‘낮에는 일을 하느라’라는 설명을 넣은 효과는?","options":["어른들이 저녁에 모여 배우는 배경을 이해하게 한다.","저녁 수업이 낮 수업보다 시험 점수가 높다고 증명한다.","마을 회관이 낮에는 언제나 문을 닫는다고 알려 준다.","선생님이 다른 직업을 갖고 있음을 드러낸다."],"answer":0,"skill":"구조","p":0,"explanation":"일과 배움을 함께 해야 하는 어른들의 처지가 수업 시간의 이유가 된다.","level":3},{"id":"P06-25","q":"마지막 문장의 ‘글은 사람과 사람의 마음을 이어 주는 길’이 뜻하는 것은?","options":["글을 통해 생각과 마음을 서로 전할 수 있다는 것","글을 배우면 실제 도로를 더 빨리 만들 수 있다는 것","모든 글은 이동 경로를 설명하기 위해서만 쓰인다는 것","손으로 글씨를 쓰는 속도만큼 빨리 걸을 수 있다는 것"],"answer":0,"skill":"표현","p":4,"explanation":"편지와 생활 메모가 사람 사이의 소통 수단이 되었다.","level":3},{"id":"P06-26","q":"글씨 모양보다 내용을 전하는 일을 중요하게 여긴 교육 방식의 장점은?","options":["학습자가 자신의 경험과 목적에 연결해 글쓰기를 계속할 수 있다.","맞춤법과 띄어쓰기를 앞으로 전혀 배울 필요가 없어진다.","글씨를 연습하지 않아도 모든 글을 즉시 읽을 수 있다.","학생이 틀린 글자를 계속 써도 선생님이 확인하지 않는다."],"answer":0,"skill":"추론","p":1,"explanation":"자신에게 의미 있는 내용을 쓰면서 학습 동기를 얻을 수 있다.","level":3},{"id":"P06-27","q":"글을 처음 배우는 학생에게 알맞은 지도 방법으로 이 글에 가장 가까운 것은?","options":["생활 안내문을 함께 읽고 어려운 부분을 뜻 단위로 나누어 본다.","읽는 속도가 느리면 뜻을 확인하지 않고 더 빨리 읽게 한다.","학생마다 실력이 달라도 똑같은 속도로 읽도록 요구한다.","모르는 글자가 나오면 앞으로 모든 글쓰기를 중단하게 한다."],"answer":0,"skill":"비판","p":2,"explanation":"글 속에서는 실제 안내문과 생활 경험을 활용해 의미를 이해하도록 도왔다.","level":3},{"id":"P06-28","q":"할머니의 편지에 대한 평가로 이 글이 가장 지지하는 것은?","options":["글씨가 조금 삐뚤어도 마음을 직접 전한 점이 의미 있다.","글씨가 반듯하지 않으므로 내용도 전달할 가치가 없다.","편지는 선생님이 대신 썼을 때만 완성했다고 할 수 있다.","손자에게 쓴 편지는 시험 점수와 무관하므로 배움이 아니다."],"answer":0,"skill":"비판","p":3,"explanation":"선생님의 교육 목표와 직접 완성한 편지의 의미를 함께 고려해야 한다.","level":3},{"id":"P06-29","q":"첫날의 교실과 겨울의 게시판을 대비하여 보여 주는 변화는?","options":["글자를 따라 쓰던 단계에서 생활 속 글로 소통하는 단계로 나아갔다.","학생들이 읽기를 포기하고 모든 활동을 그림으로 바꾸었다.","선생님이 시험 점수를 중심으로 수업을 바꾸었다.","교실이 낮에만 문을 열게 되어 학습자가 줄어들었다."],"answer":0,"skill":"구조","p":4,"explanation":"첫날의 글자 따라 쓰기와 겨울의 생활 메모가 성장 과정을 보여 준다.","level":3},{"id":"P06-30","q":"이 이야기에서 ‘배움의 속도’가 서로 달라도 괜찮다고 보는 근거는?","options":["서로 기다리며 연습한 결과 각자의 생활에 필요한 글을 쓰게 되었기 때문이다.","학생 모두가 같은 날 글자를 완벽하게 외웠기 때문이다.","실력이 느린 학생은 수업에 참가하지 않았기 때문이다.","선생님이 어려운 글자를 모두 대신 써 주었기 때문이다."],"answer":0,"skill":"추론","p":4,"explanation":"2문단의 기다림과 마지막 문단의 생활 메모가 연결된다.","level":3}]},{"id":"P07","title":"동네 책 교환회 안내","genre":"안내문","paras":["[푸른마을 책 교환회] 읽은 책을 다른 사람에게 전하고, 새로운 책을 만나 보세요. 행사는 6월 14일 토요일 오전 10시부터 오후 2시까지 마을회관 1층 열린방에서 열립니다. 이번 행사는 새 책을 판매하는 시장이 아니라 이웃끼리 읽은 책을 나누는 자리입니다. 어린이부터 어른까지 참여할 수 있으며, 교환할 책이 없는 사람도 책 소개 시간은 구경할 수 있습니다. 처음 오는 사람은 안내석에서 참여 방법을 설명받을 수 있습니다. 폭우 등으로 일정이 바뀌면 마을 게시판에 전날 오후 6시까지 알립니다.","참여자는 집에서 읽은 책 중 상태가 좋은 책을 한 사람당 최대 세 권까지 가져올 수 있습니다. 책에 이름이나 전화번호가 적혀 있다면 가린 뒤 제출해 주세요. 책을 내기 전에 표지가 떨어지지 않았는지, 본문을 읽는 데 불편이 없는지 살펴 주세요. 책에 적힌 연락처가 노출되면 다른 사람에게 개인 정보가 전달될 수 있으므로 특히 주의해야 합니다. 접수대에서는 안내된 기준에 맞는 책인지 확인한 뒤 교환표를 드립니다. 찢어졌거나 낙서가 많아 읽기 어려운 책, 문제집의 낱장, 불법 복제물은 교환할 수 없습니다.","접수대에서는 가져온 책 한 권당 교환표 한 장을 받습니다. 교환표 한 장으로 다른 책 한 권을 고를 수 있으며, 책을 먼저 고른 뒤 교환표를 내면 됩니다. 예를 들어 책 두 권을 접수했다면 교환표 두 장을 받고, 행사장에서 마음에 드는 책을 두 권까지 고를 수 있습니다. 원하는 책이 아직 없다면 다른 책을 조금 더 둘러봐도 됩니다. 다만 교환표를 잃어버리지 않도록 보관하고, 책을 최종 선택한 뒤에 제출해 주세요. 남은 교환표는 현금으로 바꿀 수 없고, 다음 행사에 사용할 수도 없습니다.","오전 11시와 오후 1시에는 각 20분 동안 ‘책 속 한 문장 소개’ 시간이 열립니다. 소개를 듣기만 해도 괜찮고, 직접 참여하려면 시작 10분 전까지 안내석에 신청하면 됩니다. 책을 소개할 때는 제목과 마음에 남은 문장, 그 문장을 고른 이유를 간단히 이야기해 보세요. 다른 사람이 자신과 다른 느낌을 말해도 끝까지 들어 주는 것이 좋습니다. 발표 시간이 부담스럽다면 듣기만 해도 충분히 행사에 참여할 수 있습니다. 행사장에서는 뛰지 말고 책을 조심히 다뤄 주세요.","교환 후 남은 책은 기증에 동의한 경우에만 마을 작은도서관으로 보냅니다. 동의하지 않은 책은 행사가 끝나기 10분 전까지 가져갈 수 있습니다. 기증할지 결정하지 못한 경우에는 접수대에서 뜻을 분명히 밝혀 주세요. 남은 책이 어떻게 처리되는지 미리 알아 두면 책을 내놓은 뒤 당황하지 않을 수 있습니다. 운영진은 교환이 끝난 뒤에도 책을 정리하고 다음 행사에서 개선할 점을 기록할 예정입니다. 행사 운영진은 새 주인을 기다리는 책도 책을 고르는 사람도 모두 존중받길 바랍니다."],"questions":[{"id":"P07-01","q":"행사의 이름은?","options":["푸른마을 책 교환회","푸른마을 책 판매회","푸른마을 책 소개 모임","푸른마을 작은도서관 개관식"],"answer":0,"skill":"사실","p":0,"explanation":"안내문 제목을 확인하면 된다.","level":1},{"id":"P07-02","q":"행사가 열리는 날짜는?","options":["6월 14일 토요일","6월 13일 금요일","6월 14일 일요일","6월 15일 일요일"],"answer":0,"skill":"사실","p":0,"explanation":"첫 문단의 행사 날짜가 6월 14일 토요일이라고 안내되어 있다. 이는 안내문 속 가상의 행사 일정이며 연도가 특정되어 있지 않다.","level":1},{"id":"P07-03","q":"행사 시간은?","options":["오전 10시~오후 2시","오전 10시~정오","오전 11시~오후 1시","오후 1시~오후 3시"],"answer":0,"skill":"사실","p":0,"explanation":"행사는 오전 10시부터 오후 2시까지 열린다.","level":1},{"id":"P07-04","q":"행사 장소는?","options":["마을회관 1층 열린방","마을회관 2층 열린방","마을 작은도서관 1층","학교 도서실"],"answer":0,"skill":"사실","p":0,"explanation":"마을회관 1층 열린방에서 열린다.","level":1},{"id":"P07-05","q":"일정이 바뀌면 어디에 알리는가?","options":["마을 게시판","행사 안내석","마을 작은도서관","학급 알림장"],"answer":0,"skill":"사실","p":0,"explanation":"마을 게시판에 알린다고 했다.","level":1},{"id":"P07-06","q":"일정 변경 공지의 기한은?","options":["전날 오후 6시까지","행사 당일 오전 10시까지","행사 전날 정오까지","행사 당일 오후 6시까지"],"answer":0,"skill":"사실","p":0,"explanation":"전날 오후 6시까지 알린다.","level":1},{"id":"P07-07","q":"한 사람이 가져올 수 있는 책의 최대 권수는?","options":["세 권","두 권","네 권","다섯 권"],"answer":0,"skill":"사실","p":1,"explanation":"두 번째 문단은 한 사람이 가져올 수 있는 책의 수를 ‘최대 세 권’이라고 제한합니다. 안내문에서는 수량과 조건을 정확히 찾아야 해요.","level":1},{"id":"P07-08","q":"책에 적힌 개인정보는 어떻게 해야 하는가?","options":["가린 뒤 제출한다","책의 제목도 지워서 제출한다","개인정보는 뒷면에 더 크게 적는다","교환이 끝난 뒤에야 이름을 가린다"],"answer":0,"skill":"사실","p":1,"explanation":"이름과 전화번호를 가리고 제출한다.","level":1},{"id":"P07-09","q":"교환할 수 없는 책은?","options":["낙서가 많아 읽기 어려운 책","표지가 조금 낡았지만 읽기에 문제 없는 책","이름을 가렸고 훼손되지 않은 책","깨끗하게 보관된 지난달에 읽은 책"],"answer":0,"skill":"사실","p":1,"explanation":"훼손이 큰 책은 교환 대상이 아니다.","level":1},{"id":"P07-10","q":"교환표 한 장을 받으려면?","options":["책 한 권을 접수한다","책 소개 시간에 참석한다","교환표 두 장을 먼저 받는다","책에 이름을 적어 제출한다"],"answer":0,"skill":"사실","p":2,"explanation":"책 한 권에 교환표 한 장이다.","level":1},{"id":"P07-11","q":"교환표 한 장으로 가능한 일은?","options":["다른 다.","level":3},{"id":"P07-28","q":"행사 전날 폭우 예보가 있다. 가장 믿을 만한 일정 확인 방법은?","options":["전날 오후 6시까지 게시되는 마을 게시판 공지를 확인한다.","지난 행사에 참여한 친구의 기억만 듣고 결정한다.","책 교환표가 몇 장 남았는지 물어보고 날짜를 추측한다.","행사장에 가는 길의 교통량만 보고 변경 여부를 판단한다."],"answer":0,"skill":"비판","p":0,"explanation":"1문단에 일정 변경의 공지 장소와 기한이 명시되어 있다.","level":3},{"id":"P07-29","q":"기증에 동의하지 않은 책의 주인이 오후 1시 55분에 책을 찾으러 왔다면?","options":["행사 종료 10분 전이라는 반환 기한을 넘겼다.","행사 시작 10분 전이므로 아직 찾을 수 있다.","오후 2시까지는 언제든 찾는 것으로 안내되어 있다.","교환표만 있으면 언제든지 책을 돌려받을 수 있다."],"answer":0,"skill":"추론","p":4,"explanation":"행사는 오후 2시에 끝나며 남은 책은 1시 50분까지 찾아가야 한다.","level":3},{"id":"P07-30","q":"행사 안내문을 더 명확하게 만들기 위해 추가하면 도움이 될 정보는?","options":["기증에 동의하지 않은 책을 기한 내 찾지 못했을 때의 처리 방법","책 소개 시간이 오전 11시에도 열린다는 사실","한 사람당 가져올 책의 최대 권수","행사가 열리는 장소와 시작 시간"],"answer":0,"skill":"비판","p":4,"explanation":"반환 기한은 있지만 기한을 넘긴 책의 처리 방식은 명시되지 않았다.","level":3}]},{"id":"P08","title":"숙제는 모두 같아야 할까","genre":"토론문","paras":["학급회의에서 ‘모든 학생에게 같은 숙제를 내야 할까?’라는 주제로 토론이 열렸다. 사회자 지우는 “상대의 의견을 끝까지 듣고, 이유를 들어 말해 봅시다.”라고 안내했다. 이날 토론은 누가 더 많은 숙제를 해야 하는지 정하는 자리가 아니었다. 공부하는 방법이 서로 다른 학생들에게 어떤 과제가 도움이 되는지 생각해 보려는 자리였다. 사회자는 발표를 들을 때 개인의 경험과 모두에게 적용할 수 있는 근거를 구분하자고 덧붙였다. 찬성 측은 공통 숙제가 공정함을 높인다고 했고, 반대 측은 학생마다 필요한 연습이 다르다고 말했다.","찬성 측의 첫 발언자는 같은 숙제라면 모두가 같은 내용을 익혔는지 확인하기 쉽다고 설명했다. 교사가 함께 풀이하고 질문을 나누기도 편리하다는 것이다. 찬성 측은 공통 숙제가 있으면 같은 내용을 바탕으로 친구들끼리 도움을 주고받기 쉽다고도 말했다. 또한 누구에게 더 어려운 문제가 주어졌는지를 둘러싼 불만을 줄일 수 있다고 덧붙였다. 무엇을 배웠는지 확인할 기준이 같다는 장점도 있었다. 발표가 끝나자 한 학생은 숙제의 양이 같다고 해서 모두가 느끼는 어려움까지 같아지는지 질문했다.","반대 측은 같은 문제가 반드시 같은 기회를 뜻하지는 않는다고 반박했다. 이미 익힌 내용을 반복하면 지루할 수 있고, 기초가 부족한 학생에게는 너무 어려울 수 있기 때문이다. 반대 측의 한 학생은 글을 읽는 속도가 다르면 같은 분량의 숙제라도 걸리는 시간이 달라진다는 예를 들었다. 또 누구에게는 쉬운 과제가 다른 사람에게는 많은 설명이 필요한 과제일 수 있다고 말했다. 그래서 개인에게 필요한 연습을 고를 수 있으면 배우는 데 도움이 된다고 주장했다. 하지만 기본 학습을 놓치지 않는 방법도 함께 생각해야 한다는 의견에는 귀를 기울였다.","질문 시간에 찬성 측은 “각자 다른 숙제를 하면 교사가 어떻게 확인하나요?”라고 물었다. 반대 측은 “공통으로 확인할 핵심 문제를 조금 두고, 나머지는 수준과 관심에 맞게 고르게 하면 됩니다.”라고 답했다. 공통 핵심 문제를 두자는 제안은 양쪽이 중요하게 생각하는 점을 연결했다. 모두가 꼭 알아야 할 내용은 함께 확인하고, 추가 연습이 필요한 부분은 선택할 수 있도록 하자는 것이다. 사회자는 이 제안이 실제로 도움이 되는지 알아보려면 한동안 적용한 뒤 결과를 확인해야 한다고 정리했다. 찬성 측도 핵심 학습 내용을 함께 확인한다는 조건에는 동의했다.","토론을 마친 뒤 학급은 당장 한쪽 방식으로만 정하지 않기로 했다. 다음 달에는 공통 문제 세 개와 선택 문제 두 개를 함께 운영한 뒤 학생의 느낌과 학습 결과를 조사하기로 했다. 시험 점수만 보면 어떤 학생에게 왜 숙제가 어려웠는지 알기 힘들 수 있다. 그래서 학생들이 숙제에 걸린 시간과 도움이 된 부분도 함께 적어 보기로 했다. 이처럼 학급은 찬성과 반대 가운데 하나를 바로 고르기보다 서로의 걱정을 반영한 방법을 시험해 보기로 했다. 지우는 “토론은 누가 이겼는지보다 더 나은 방법을 찾는 일일 수 있어요.”라고 정리했다."],"questions":[{"id":"P08-01","q":"토론의 주제는?","options":["모든 학생에게 같은 숙제를 내야 하는가","선택 문제는 얼마나 어려워야 할까","숙제 양을 늘리는 것이 좋을까","공통 숙제만 계속해야 할까"],"answer":0,"skill":"사실","p":0,"explanation":"학급회의에서 숙제 방식에 대해 토론한다.","level":1},{"id":"P08-02","q":"토론 사회자의 이름은?","options":["지우","은하","민서","준호"],"answer":0,"skill":"사실","p":0,"explanation":"첫 번째 문단의 ‘사회자 지우는’이라는 표현에서 사회자가 누구인지 확인할 수 있습니다. 인물의 역할과 이름을 연결해 읽으세요.","level":1},{"id":"P08-03","q":"사회자가 제시한 토론 태도는?","options":["상대 의견을 끝까지 듣고 이유를 들어 말하기","찬성 의견만 끝까지 듣기","말하는 사람의 이름만 기록하기","이유보다 큰 목소리를 우선하기"],"answer":0,"skill":"사실","p":0,"explanation":"경청과 근거 있는 발언을 안내했다.","level":1},{"id":"P08-04","q":"찬성 측이 내세운 가치 중 하나는?","options":["공정함","학생별 선택의 자유","서로 다른 과제를 주는 방법","과제마다 다른 난이도"],"answer":0,"skill":"사실","p":0,"explanation":"공통 숙제가 공정함을 높인다고 했다.","level":1},{"id":"P08-05","q":"찬성 측이 말한 공통 숙제의 장점은?","options":["같은 내용 학습 여부를 확인하기 쉬움","모든 학생의 흥미가 같아짐","개별 학생의 어려움이 자동으로 사라짐","숙제 검사 시간이 언제나 줄어듦"],"answer":0,"skill":"사실","p":1,"explanation":"모두의 공통 학습 상태를 확인하기 쉽다.","level":1},{"id":"P08-06","q":"찬성 측이 교사에게 편리하다고 한 활동은?","options":["함께 풀이하고 질문을 나누기","학생마다 과제를 한 번씩 따로 설명하기","선택 문제를 각자 만들게 한 뒤 확인하기","모든 학생이 서로 다른 내용을 풀게 하기"],"answer":0,"skill":"사실","p":1,"explanation":"공통 문제로 함께 풀이와 질문을 할 수 있다.","level":1},{"id":"P08-07","q":"찬성 측이 줄일 수 있다고 본 것은?","options":["문제 난이도 차이에서 생기는 불만","과제의 총량을 늘리는 불만","숙제 제출 시간을 정하는 불만","교실에서 질문하는 순서의 불만"],"answer":0,"skill":"사실","p":1,"explanation":"문제 차이에 대한 불만을 줄일 수 있다고 했다.","level":1},{"id":"P08-08","q":"반대 측의 중심 주장은?","options":["학생마다 필요한 연습이 다르다","모든 학생에게 같은 문제만 내야 한다","선택 숙제도 하지 말아야 한다","공통 숙제를 폐지하고 확인도 하지 .","학생들이 공부를 싫어한다는 사실을 증명한다.","상대의 말을 더 들을 필요가 없음을 선언한다."],"answer":0,"skill":"비판","p":3,"explanation":"교사가 서로 다른 숙제를 어떻게 확인할지 실행 가능성을 묻는다.","level":3},{"id":"P08-26","q":"토론 후 곧바로 한쪽의 승리를 선언하지 않은 이유는?","options":["두 입장의 장점을 조합한 방법을 직접 시험해 보기로 했기 때문이다.","찬성과 반대가 숙제를 아예 하지 않기로 뜻을 모았기 때문이다.","어느 학생도 자신의 생각을 말하지 않았기 때문이다.","토론 주제의 뜻을 학급이 전혀 이해하지 못했기 때문이다."],"answer":0,"skill":"추론","p":4,"explanation":"공통 세 문제와 선택 두 문제를 운영하고 결과를 조사하기로 했다.","level":3},{"id":"P08-27","q":"이 토론의 흐름을 가장 정확하게 나타낸 것은?","options":["서로 다른 주장과 근거 → 질문과 조정 → 절충안 시험","사회자의 결론 → 한쪽의 주장 삭제 → 숙제 폐지","같은 의견만 반복 → 투표 없이 승자 결정 → 종료","질문으로 시작 → 인물 소개 → 새로운 교과 설명"],"answer":0,"skill":"구조","p":4,"explanation":"각 입장을 설명하고 반론을 통해 시험할 방안을 만든다.","level":3},{"id":"P08-28","q":"제안한 공통·선택 숙제 방식의 효과를 살피려면 무엇을 비교해야 하는가?","options":["학생의 학습 결과와 부담감이 이전 숙제 방식과 어떻게 달라졌는가","숙제 종이의 색깔이 여러 종류로 늘었는가","발언한 학생의 이름을 모두 기억하는가","공통 문제의 번호가 항상 앞에 나오는가"],"answer":0,"skill":"비판","p":4,"explanation":"학급은 학생 느낌과 학습 결과를 살펴보기로 했다.","level":3},{"id":"P08-29","q":"‘공통 숙제만이 공정하다’는 주장에 제기할 수 있는 합리적 질문은?","options":["출발점이 다른 학생에게 같은 난도가 정말 같은 학습 기회를 줄까?","공통 숙제는 모두 같은 종이에 인쇄할 수 있을까?","공통 숙제를 낸 날의 날씨는 어떠했을까?","공통 문제의 글꼴은 어떤 것을 사용했을까?"],"answer":0,"skill":"비판","p":1,"explanation":"반대 측의 핵심 반박은 똑같은 과제가 실질적 공평함을 보장하진 않는다는 것이다.","level":3},{"id":"P08-30","q":"토론을 통해 학급이 얻은 가장 중요한 변화는?","options":["두 주장의 장점을 고려해 시험하고 판단하는 태도를 갖게 되었다.","상대 주장에는 대답하지 않는 것이 좋다고 합의했다.","숙제 난도는 학생마다 다를 수 없다고 결론 내렸다.","하나의 주장만 옳으므로 다른 의견은 더는 듣지 않기로 했다."],"answer":0,"skill":"추론","p":4,"explanation":"토론의 목적을 승패보다 더 나은 해결책 찾기로 정리했다.","level":3}]},{"id":"P09","title":"오래 기억하는 읽기의 기술","genre":"설명문","paras":["책을 오래 읽었다고 해서 내용을 모두 기억하는 것은 아니다. 같은 문장을 여러 번 눈으로 훑으면 익숙하게 느껴지지만, 책을 덮었을 때 설명하기 어려운 경우가 있다. 책장을 넘길 때에는 알 것 같았던 내용이 친구에게 설명하려는 순간 잘 떠오르지 않기도 한다. 이는 글자가 낯익은 것과 그 내용을 자기 지식으로 이해한 것이 다를 수 있음을 보여 준다. 읽은 뒤 무엇을 기억하고 무엇을 놓쳤는지 살피면 다시 읽어야 할 곳을 더 쉽게 찾을 수 있다. 그래서 읽은 내용을 스스로 떠올려 보는 연습이 중요하다.","첫 번째 방법은 한 문단을 읽고 책에서 눈을 떼는 것이다. 그 문단에서 가장 중요한 내용을 한 문장으로 말하거나 써 본다. 생각나지 않으면 다시 읽어 확인한 뒤, 자신의 말로 바꾸어 정리한다. 처음에는 문단 전체를 그대로 기억하려고 애쓰지 않아도 된다. 가장 중요한 낱말 두세 개를 떠올린 뒤 그것이 서로 어떻게 이어지는지 말해 보면 된다. 요약이 원문과 다르다고 느껴지면 어떤 정보가 빠졌는지 확인해 고친다. 이렇게 하면 자신이 이해한 부분과 아직 모호한 부분을 구분할 수 있다. 원문을 그대로 베끼는 것보다 의미를 이해하는 데 초점을 둔다.","두 번째는 질문을 만드는 것이다. “왜 그런 일이 일어났을까?”, “이 설명을 뒷받침하는 예는 무엇일까?”처럼 글에 맞는 질문을 해 본다. 질문에 답하려면 서로 떨어져 있는 정보를 연결해야 할 때가 있다. 질문은 단순히 답을 빨리 찾으려는 도구가 아니다. 한 문단에서는 원인을 설명하고 다른 문단에서는 결과를 소개한다면, 두 문단을 연결하는 질문을 만들 수 있다. 질문에 답을 찾지 못했을 때는 그 사실을 표시해 두었다가 관련 내용을 다시 읽는 것이 도움이 된다. 이렇게 읽으면 글의 겉내용을 넘어 관계를 파악하는 데 도움이 된다.","세 번째는 잠시 뒤 다시 확인하는 것이다. 방금 읽은 내용은 쉽게 기억날 수 있지만 시간이 지나면 일부가 흐려진다. 다음 날 핵심 내용을 다시 떠올리고 빠진 부분을 확인하면 자신의 이해 상태를 점검할 수 있다. 예를 들어 오늘 읽은 설명문을 내일 다시 펼치기 전에 중요한 내용 세 가지를 먼저 써 볼 수 있다. 모두 떠오르지 않더라도 기억나는 점과 기억나지 않는 점을 구별하는 과정에 의미가 있다. 이후 글을 다시 읽으며 빠진 내용을 보충하면 무작정 처음부터 반복하는 것보다 효율적으로 확인할 수 있다. 단, 모든 글을 똑같은 방법으로 읽을 필요는 없다.","이야기 글은 사건의 흐름과 인물의 변화를, 설명문은 중심 개념과 근거의 관계를 살피면 좋다. 읽기 방법은 글의 목적과 자신이 어려워하는 부분에 따라 달라져야 한다. 시를 읽을 때는 떠오르는 장면과 표현의 느낌을 살피는 것이 도움이 되고, 주장하는 글을 읽을 때는 주장과 이유가 어떻게 연결되는지 따져 볼 수 있다. 어느 한 방법이 모든 학생과 모든 글에 똑같이 맞지는 않는다. 읽다가 막히는 곳을 확인하고 그 부분에 알맞은 질문을 고르는 태도가 중요하다. 중요한 것은 빨리 끝내는 일이 아니라 읽은 내용을 자신의 언어로 설명할 수 있는가이다."],"questions":[{"id":"P09-01","q":"첫 문단에서 지적한 문제는?","options":["오래 읽어도 내용을 기억하지 못할 수 있음","오래 읽기만 하면 내용을 더 잘 설명할 수 있음","책을 많이 읽으면 질문이 필요 없어짐","읽은 내용을 다시 확인할 필요가 없음"],"answer":0,"skill":"사실","p":0,"explanation":"읽은 시간과 기억이 같지 않다고 했다.","level":1},{"id":"P09-02","q":"반복해서 눈으로 훑을 때 생길 수 있는 착각은?","options":["익숙하다는 느낌을 이해로 착각함","반복해서 읽으면 반드시 모든 내용을 기억함","익숙한 문장은 언제나 정확히 이해함","페이지 수를 외우면 중심 내용을 알 수 있음"],"answer":0,"skill":"추론","p":0,"explanation":"익숙함만으로 실제 설명이 되는 것은 아니다.","level":1},{"id":"P09-03","q":"중요하게 제시한 연습은?","options":["읽은 내용을 스스로 떠올리기","같은 문장을 이해 없이 여러 번 소리 내기","문장 길이와 단어 수를 외우기","질문을 만들지 않고 곧바로 다음 글 읽기"],"answer":0,"skill":"사실","p":0,"explanation":"스스로 회상하는 연습이 중요하다.","level":1},{"id":"P09-04","q":"첫 번째 방법에서 한 문단을 읽은 뒤 할 일은?","options":["눈을 떼고 중심 내용을 말하거나 쓰기","문단의 문장을 한 번 더 그대로 베껴 쓰기","책에서 눈을 떼지 않고 바로 다음 문단 읽기","떠오르는 단어를 확인하지 않고 넘어가기"],"answer":0," 23","q":"한 문단을 읽고 중심 내용을 말하지 못할 때 글이 권하는 다음 행동은?","options":["관련 문장을 다시 읽고 중요한 뜻을 자기 말로 정리한다.","기억나지 않더라도 읽은 횟수만 기록한다.","내용을 확인하지 않은 채 다음 문단으로 넘어간다.","같은 문장을 뜻을 생각하지 않고 그대로 계속 베낀다."],"answer":0,"skill":"추론","p":1,"explanation":"이해 여부를 확인하고 부족한 부분을 다시 읽도록 권한다.","level":3},{"id":"P09-24","q":"‘질문 만들기’ 전략을 적용한 사례로 가장 알맞은 것은?","options":["두 문단의 정보를 연결해 등장인물의 선택 이유를 묻는다.","본문의 첫 문장에 있는 글자 수만 센다.","글을 읽기 전 제목의 글씨 크기를 비교한다.","답을 이미 알고 있는 질문만 열 번 반복한다."],"answer":0,"skill":"비판","p":2,"explanation":"읽은 내용을 바탕으로 왜·어떻게 등의 관계를 묻는 질문이 필요하다.","level":3},{"id":"P09-25","q":"다음 날 핵심 내용을 떠올려 보는 활동이 주는 도움은?","options":["시간이 지난 뒤에도 기억하는 내용과 빠진 부분을 점검할 수 있다.","글을 다시는 보지 않아도 모든 내용을 완벽히 기억하게 한다.","새로운 글을 읽을 때마다 반드시 같은 속도를 유지하게 한다.","책의 페이지 수를 자동으로 줄여 준다."],"answer":0,"skill":"추론","p":3,"explanation":"시간이 지나면 기억이 흐려질 수 있으므로 재확인이 필요하다.","level":3},{"id":"P09-26","q":"마지막 문단이 앞선 세 가지 방법 뒤에 놓인 이유는?","options":["제시한 읽기 방법을 글의 종류와 목적에 맞춰 선택하도록 정리하기 위해","앞에서 소개한 방법들이 모두 틀렸다고 주장하기 위해","읽기를 멈추고 쓰기만 해야 한다고 결론 내리기 위해","어떤 글이든 한 가지 방식만 사용해야 한다고 강조하기 위해"],"answer":0,"skill":"구조","p":4,"explanation":"방법을 소개한 뒤 상황에 맞게 조절하라는 종합적 조언을 덧붙인다.","level":3},{"id":"P09-27","q":"‘한 권을 두 시간 읽었으니 완벽히 이해했다’는 말에 가장 적절한 반응은?","options":["시간만으로 판단하기보다 내용을 자기 말로 설명할 수 있는지 확인하자.","두 시간이 지났다면 이해를 확인하지 않아도 충분하다.","읽은 시간이 짧으면 어떤 내용도 이해할 수 없다.","문장을 많이 읽은 사람은 반드시 더 많이 기억한다."],"answer":0,"skill":"비판","p":0,"explanation":"첫 문단은 읽은 시간이나 반복 횟수만으로 이해를 보장할 수 없다고 한다.","level":3},{"id":"P09-28","q":"설명문을 읽는 학생이 글의 종류에 맞게 읽고 있는 모습은?","options":["개념과 이를 뒷받침하는 사례의 관계를 표로 정리한다.","설명문에도 반드시 등장인물의 마음 변화만 찾는다.","각 문장의 마지막 글자만 모아 읽는다.","글의 중심 개념을 찾지 않고 문단 수만 센다."],"answer":0,"skill":"비판","p":4,"explanation":"마지막 문단은 설명문에서 개념과 근거의 관계를 살피라고 한다.","level":3},{"id":"P09-29","q":"같은 글을 여러 번 읽은 학생의 이해를 확인할 질문으로 가장 적절한 것은?","options":["왜 그런 결론이 나오는지 글 속 두 가지 근거를 들어 설명해 볼래?","책을 몇 번 읽었는지 기억하니?","문장의 글꼴이 무엇이었는지 기억하니?","아까 몇 페이지까지 넘겼는지 기억하니?"],"answer":0,"skill":"비판","p":2,"explanation":"이해는 내용을 다시 떠올리고 근거를 연결해 설명하는 능력으로 점검한다.","level":3},{"id":"P09-30","q":"이 글에서 권하는 읽기 방법들의 공통점은?","options":["읽은 내용을 스스로 떠올리고 점검하며 필요한 부분을 조정한다.","읽는 시간을 무조건 줄이는 것을 가장 중요한 목표로 둔다.","원문의 문장을 완벽히 외워 적는 것을 목표로 둔다.","글의 종류와 관계없이 한 가지 답만 찾게 한다."],"answer":0,"skill":"구조","p":4,"explanation":"요약, 질문, 시간차 점검 모두 능동적인 이해 확인 과정이다.","level":3}]},{"id":"P10","title":"지도 위에 남은 약속","genre":"생활문","paras":["방학 첫날, 나는 할아버지와 오래된 종이 지도를 펼쳤다. 지도에는 강과 다리, 작은 공원이 연필로 표시되어 있었다. 할아버지는 “예전에 이 다리를 함께 건너기로 했던 약속을 기억하니?”라고 물으셨다. 어릴 때 했던 약속이라 나는 선뜻 떠올리지 못했다. 지도의 접힌 자국은 여러 번 펼쳤다 접은 흔적처럼 희미하게 하얗게 변해 있었다. 나는 지도에 표시된 작은 공원이 지금도 있을지 궁금했다. 할아버지는 지도 가장자리에 적힌 오래된 날짜를 가리키며 그때의 동네가 지금과는 많이 달랐다고 말씀하셨다.","우리는 버스를 타고 강가로 갔다. 지금은 새 다리가 놓였지만 지도 속 다리는 조금 떨어진 곳에 남아 있었다. 버스에서 내리자 익숙하지 않은 골목과 새로 지은 건물들이 보였다. 길을 찾는 동안 휴대전화 지도는 더 빠른 길을 알려 주었다. 나는 휴대전화 화면에서 화살표를 따라 걷는 편이 편하다고 생각했다. 나는 그 길을 가자고 했지만 할아버지는 천천히 걸으며 주변을 보고 싶다고 하셨다. 할아버지는 한동안 걸음을 늦추고 사라진 가게가 있던 자리를 바라보셨다. 같은 길을 걸어도 두 사람이 보고 있는 것은 조금 달랐다.","낡은 다리 앞에서 할아버지는 이곳에서 처음 자전거를 배우셨던 이야기를 들려주셨다. 강물은 예전과 다르게 흐르는 것 같았지만, 돌계단 옆의 큰 느티나무는 여전히 같은 자리에 있었다. 할아버지는 넘어질까 두려워하던 자신에게 누군가 자전거 뒷자리를 잡아 주었던 일을 떠올리셨다. 그 이야기를 듣자 나는 다리가 단순히 강을 건너기 위한 시설이 아니라 한 사람의 용기와 배움이 남은 장소처럼 느껴졌다. 계단 옆 느티나무를 올려다보며 그때의 모습을 상상해 보았다. 나는 지도를 그린 선이 단순한 길 표시가 아니라 누군가의 시간이 머문 흔적일 수도 있겠다고 생각했다.","다리를 건넌 뒤 우리는 공원 벤치에서 도시락을 나눠 먹었다. 할아버지는 이제 오래 걷기 어려워 다음에는 가까운 길을 택해야겠다고 웃으셨다. 나는 도시락을 먹으면서 오래된 지도에는 표시되지 않은 새 길을 몇 가지 알려 드렸다. 할아버지는 내 이야기를 들으며 옛날과 달라진 동네 모습을 천천히 살피셨다. 함께 걸은 길의 길이보다 나눈 이야기가 마음에 더 오래 남는다는 생각이 들었다. 그제야 나는 약속의 내용이 다리를 빨리 건너는 것이 아니라 함께 걸으며 이야기를 나누는 일이었음을 깨달았다.","집에 돌아와 나는 종이 지도에 오늘 날짜를 적고, 우리가 걸은 길을 파란색으로 덧그렸다. 휴대전화 지도에는 나오지 않는 이야기도 그 선 안에 담긴 것 같았다. 나는 파란 선 옆에 다리에서 들은 자전거 이야기도 짧게 적었다. 시간이 지나 종이 지도가 더 낡아지더라도 그날 들은 말과 우리가 함께 걸었던 순간은 잊지 않고 싶었다. 할아버지와 보낸 하루가 지도에 새로운 이야기를 하나 더 보탠 셈이었다. 지도는 길을 알려 주지만, 어떤 길을 소중하게 기억할지는 그 길을 걸은 사람이 정한다."],"questions":[{"id":"P10-01","q":"이야기의 때는?","options":["방학 첫날","방학 마지막 날","개학 첫날","졸업식 전날"],"answer":0,"skill":"사실","p":0,"explanation":"첫 문장에서 방학 첫날이라고 했다.","level":1},{"id":"P10-02","q":"화자와 지도를 펼친 사람은?","options":["할아버지","아버지","친구","선생 // 지원 환경에서는 Mediapipe 추론을 Web Worker로 이동하고, 실패하면 기존 로컬 메인 스레드 추론으로 복귀한다.
// 웹캠 원본은 외부로 업로드하지 않으며 Worker로 전달한 ImageBitmap도 프레임 처리 후 즉시 닫는다.
function workerSource(){return `
let model=null;
self.onmessage=async (event)=>{
 const data=event.data;
 if(data.type==='init'){
  try{
   const {FilesetResolver,FaceLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs');
   const wasm=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
   model=await FaceLandmarker.createFromOptions(wasm,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:false,outputFacialTransformationMatrixes:false});
   self.postMessage({type:'ready'});
  }catch(error){self.postMessage({type:'error',message:String(error)});}
 }else if(data.type==='frame'){
  const bitmap=data.bitmap;
  try{const start=performance.now(),r=model.detectForVideo(bitmap,data.stamp);
   self.postMessage({type:'face',cost:performance.now()-start,stamp:data.stamp,points:r.faceLandmarks?.[0]||null});
  }catch(error){self.postMessage({type:'frameError',message:String(error)});}
  finally{bitmap.close();}
 }else if(data.type==='close'){try{model?.close();}catch{}self.close();}
};`}
function initializeWorker(){
 return new Promise((resolve,reject)=>{
  if(typeof Worker==='undefined'||typeof createImageBitmap!=='function')return reject(new Error('No Worker/ImageBitmap'));
  let url,worker,finished=false,timeout;
  const fail=err=>{if(finished)return;finished=true;clearTimeout(timeout);try{worker?.terminate();}catch{}if(url)URL.revokeObjectURL(url);reject(err);};
  try{url=URL.createObjectURL(new Blob([workerSource()],{type:'text/javascript'}));worker=new Worker(url,{type:'module'});}catch(error){fail(error);return;}
  timeout=setTimeout(()=>fail(new Error('Worker start timeout')),13000);
  worker.onerror=e=>{e.preventDefault();fail(new Error('Worker script unavailable'));};
  worker.onmessage=event=>{const d=event.data;if(d.type==='error'){fail(new Error(d.message));return;}if(d.type!=='ready')return;
    if(finished)return;finished=true;clearTimeout(timeout);URL.revokeObjectURL(url);
    worker.onerror=e=>{e.preventDefault();if(cam.worker===worker)stopCamera();};
    worker.onmessage=event=>onWorkerResult(event.data);
    resolve(worker);
  };
  worker.postMessage({type:'init'});
 });
}
function onWorkerResult(data){
 if(!cam.worker||!cam.stream)return;
 if(data.type==='frameError'){
  cam.errors++;if(cam.errors>=4){say('영상 분석이 중단됐습니다. 독해·채점은 계속할 수 있어요.');stopCamera();return;}
 }else if(data.type==='face'){
  const started=performance.now();cam.frameWeightMs=cam.lastFrameAt?Math.max(20,Math.min(420,started-cam.lastFrameAt)):cam.period;
  cam.lastFrameAt=started;
  cameraFrame({faceLandmarks:data.points?[data.points]:[]});
  tuneCameraPerformance(data.cost,started);
 }
 cam.workerBusy=false;
 if(cam.stream&&cam.worker)scheduleCamera(cam.period);
}

// 장치 성능 정보는 초기 추정에만 사용. 실제 분석 시간과 처리 주기를 계속 측정해 자동 조절한다.
const CAMERA_PROFILES={
 eco:{label:'저사양',width:640,height:480,period:200,minPeriod:130,maxPeriod:420},
 balanced:{label:'표준',width:960,height:540,period:140,minPeriod:105,maxPeriod:360},
 fast:{label:'고성능',width:1280,height:720,period:105,minPeriod:90,maxPeriod:320}
};
function deviceProfile(){
 const cores=Number(navigator.hardwareConcurrency)||0,ram=Number(navigator.deviceMemory)||0;
 if(navigator.connection?.saveData)return 'eco';
 if(cores>=8&&(!ram||ram>=8))return 'fast';
 if((cores>=6&&(!ram||ram>=4))||(cores>=4&&ram>=6))return 'balanced';
 return 'eco';
}
let cam={stream:null,landmarker:null,timer:null,initialized:false,frames:0,good:0,lastFaceTime:0,feature:null,validFace:false,bright:0,training:null,model:null,calibration:null,calSeq:null,calIndex:0,calTimer:null,calTarget:null,collect:[],readLast:null,
 profile:'eco',period:200,perfTimes:[],recentFrameTimes:[],lastFrameAt:0,frameWeightMs:150,measuredFps:0,medianDetectMs:0,autoSlowWindows:0,session:0,lastVideoTime:-1,errors:0,resizing:false,worker:null,workerBusy:false};
function applyInitialCameraProfile(){cam.profile=deviceProfile();cam.period=CAMERA_PROFILES[cam.profile].period;cam.perfTimes=[];cam.recentFrameTimes=[];cam.lastFrameAt=0;cam.frameWeightMs=cam.period;cam.measuredFps=0;cam.medianDetectMs=0;cam.autoSlowWindows=0;cam.lastVideoTime=-1;cam.errors=0;}
function cameraPerformanceText(){
 const settings=cam.stream?.getVideoTracks()?.[0]?.getSettings?.()||{};
 const resolution=settings.width&&settings.height?`${settings.width}×${settings.height}`:`${CAMERA_PROFILES[cam.profile].width}×${CAMERA_PROFILES[cam.profile].height} 요청`;
 const fps=cam.measuredFps?` · 실측 ${cam.measuredFps.toFixed(1)}회/초`:'';
 return `기기 자동 조절 · ${cam.worker?'별도 스레드':'호환 모드'} · ${CAMERA_PROFILES[cam.profile].label} · ${resolution} · 목표 ${Math.round(1000/cam.period)}회/초${fps}`;
}
function updateCameraPerformanceUI(){
 const t=cameraPerformanceText();if($('cameraPerf'))$('cameraPerf').textContent=t;
 if($('setupPerf'))$('setupPerf').textContent=cam.stream?t:`연결 시 기기 성능을 고려해 해상도와 분석 속도를 자동 선택합니다.`;
}
function scheduleCamera(wait){if(!cam.stream||!cam.landmarker)return;clearTimeout(cam.timer);cam.timer=setTimeout(cameraLoop,Math.max(25,wait));}
async function reduceCameraResolution(){
 if(cam.resizing||cam.calSeq||cam.calibration||s.stage!=='setup'||cam.profile==='eco'||!cam.stream)return;
 const next=cam.profile==='fast'?'balanced':'eco';const target=CAMERA_PROFILES[next],track=cam.stream.getVideoTracks()[0];
 cam.resizing=true;
 try{await track.applyConstraints({width:{ideal:target.width},height:{ideal:target.height},frameRate:{ideal:24,max:30}});cam.profile=next;cam.period=Math.max(cam.period,target.period);cam.autoSlowWindows=0;cam.perfTimes=[];say('기기 부하가 높아 카메라 해상도를 자동으로 낮췄습니다.');}
 catch(err){console.warn('Camera resolution adjustment:',err);cam.period=Math.min(420,cam.period+50);}
 finally{cam.resizing=false;updateCameraPerformanceUI();}
}
function tuneCameraPerformance(cost,now){
 cam.perfTimes.push(cost);if(cam.perfTimes.length>16)cam.perfTimes.shift();
 cam.recentFrameTimes.push(now);while(cam.recentFrameTimes.length>16)cam.recentFrameTimes.shift();
 if(cam.recentFrameTimes.length>=5){const a=cam.recentFrameTimes;const span=a[a.length-1]-a[0];if(span>0)cam.measuredFps=1000*(a.length-1)/span;}
 if(cam.perfTimes.length<12||cam.frames%12!==0)return;
 const elapsed=median(cam.perfTimes);cam.medianDetectMs=Math.round(elapsed);
 // 전용 기기가 아닌 경우 프레임 처리에 80ms 이상 걸리면 호출 빈도를 우선 낮춘다.
 if(elapsed>80||elapsed>cam.period*.65){cam.period=Math.min(420,cam.period+45);cam.autoSlowWindows++;}
 else if(elapsed<Math.min(42,cam.period*.33)&&cam.period>CAMERA_PROFILES[cam.profile].minPeriod){cam.period=Math.max(CAMERA_PROFILES[cam.profile].minPeriod,cam.period-15);cam.autoSlowWindows=0;}
 else cam.autoSlowWindows=Math.max(0,cam.autoSlowWindows-1);
 if(cam.autoSlowWindows>=2)reduceCameraResolution();
 if(elapsed>180&&cam.profile==='eco'&&cam.autoSlowWindows>=3){
  say('이 기기는 영상 분석 지연이 커서 카메라 분석을 자동 중지했습니다. 독해·채점은 계속됩니다.');
  stopCamera();return;
 }
 updateCameraPerformanceUI();
}
async function cameraLoop(){
 cam.timer=null;
 if(!cam.stream||!cam.landmarker)return;
 if(document.hidden){cam.lastFrameAt=0;scheduleCamera(450);return;}
 const v=$('cameraVideo');if(v.readyState<2||cam.resizing){scheduleCamera(180);return;}
 if(v.currentTime===cam.lastVideoTime){scheduleCamera(Math.max(45,cam.period));return;}
 cam.lastVideoTime=v.currentTime;
 if(cam.worker){
  if(cam.workerBusy)return;
  cam.workerBusy=true;
  const session=cam.session;
  try{const bitmap=await createImageBitmap(v);
   if(cam.session!==session||!cam.worker){bitmap.close();cam.workerBusy=false;return;}
   cam.worker.postMessage({type:'frame',bitmap,stamp:performance.now()},[bitmap]);
  }catch(error){cam.workerBusy=false;console.warn('Worker frame:',error);
    cam.errors++;if(cam.errors>=4){stopCamera();say('카메라 분석을 중단했습니다. 독해는 계속 사용할 수 있어요.');}
    else scheduleCamera(cam.period);
  }
  return;
 }
 const started=performance.now();
 cam.frameWeightMs=cam.lastFrameAt?Math.max(20,Math.min(400,started-cam.lastFrameAt)):cam.period;
 cam.lastFrameAt=started;cameraFrame();
 const cost=performance.now()-started;
 if(cam.stream&&cam.landmarker){tuneCameraPerformance(cost,started);scheduleCamera(cam.period-cost);}
}

function sound(kind){
 if(!soundEnabled||!SFX_SOURCES[kind])return;
 const now=performance.now();if(kind==='select'&&now-lastSoundAt<130)return;lastSoundAt=now;
 try{const audio=new Audio(SFX_SOURCES[kind]);audio.volume=({page:.27,select:.22,complete:.29,perfect:.34})[kind]||.25;audio.play().catch(()=>{});}catch{}
}

// 화면 전환/기록 조회에서 반복 재생하지 않고, 정확히 100점일 때 최초 한 번 실행한다.
let celebratedSession=null;
function celebratePerfectScore(){
 if(!s?.result||s.result.correct!==10||celebratedSession===s.sessionId)return;
 celebratedSession=s.sessionId;
 sound('perfect');
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const prev=document.getElementById('perfectCelebration');if(prev)prev.remove();
 const layer=document.createElement('div');layer.id='perfectCelebration';layer.className='celebration-layer no-print';layer.setAttribute('aria-hidden','true');
 const colors=['#d6b05c','#6d9d7a','#f3cd87','#a4b8a1','#e8b4a4','#d9d9c4'];
 const count=window.innerWidth<600?24:42;
 for(let i=0;i<count;i++){
  const piece=document.createElement('i');piece.className='celebration-piece';
  const phase=(i*.61803398875)%1;
  piece.style.setProperty('--x',(3+phase*94).toFixed(2)+'%');
  piece.style.setProperty('--w',(3.2+(i%3)*1.2)+'px');piece.style.setProperty('--h',(8+(i%4)*2)+'px');
  piece.style.setProperty('--c',colors[i%colors.length]);
  piece.style.setProperty('--delay',((i%8)*.072)+'s');
  piece.style.setProperty('--dur',(1.5+(i%7)*.13)+'s');
  piece.style.setProperty('--drift',(((i*37)%160)-80)+'px');
  piece.style.setProperty('--spin',((i%2?1:-1)*(260+i*13))+'deg');
  layer.appendChild(piece);
 }
 document.body.appendChild(layer);
 window.setTimeout(()=>layer.remove(),3100);
}

let toastTimer=null, tickTimer=null, visPaused=false;

function setStage(stage){s.stage=stage;document.body.dataset.stage=stage;const current=stage==='home'||stage==='setup'||stage==='history'?0:stage==='read'?1:stage==='quiz'?2:3;[...$('stageNav').children].forEach((e,i)=>e.className=i===current?'nav-on':i<current?'nav-done':'');$('readingScrollRail').classList.toggle('hidden',stage!=='read');window.scrollTo({top:0,behavior:'instant'});if(stage==='read')requestAnimationFrame(updateReadingScroll);}

function formatTime(ms){const t=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;}
function nowReading(){return s.readMs+(s.readActive?performance.now()-s.readSince:0);}
function pauseReading(){if(s.readActive){s.readMs=nowReading();s.readActive=false;}}
function resumeReading(){if(!s.readActive){s.readSince=performance.now();s.readActive=true;}}
function stopAllTicks(){if(tickTimer){clearInterval(tickTimer);tickTimer=null;}}
function startClock(){stopAllTicks();tickTimer=setInterval(()=>{if(s.stage==='read'&&$('readerTimer'))$('readerTimer').textContent=formatTime(nowReading());if(s.stage==='quiz'&&$('quizTimer'))$('quizTimer').textContent=formatTime(performance.now()-s.quizSince);},250);}
function getHistory(){try{return JSON.parse(localStorage.getItem('readinggyeol_history')||'[]')||[];}catch{return [];}}
function historyEntry(){
 const r=s.readStats||{};
 const frames=Math.max(0,Number(r.headFrames)||0);
 const faceGood=frames?Math.round(100*Math.max(0,Number(r.headGood)||0)/frames):null;
 const evidence=cam.calibration&&cam.calibration.grade!=='low'&&Number(r.observations)>=9;
 return {sessionId:s.sessionId,date:new Date().toISOString(),passage:s.passage.title,passageId:s.passage.id,
  name:s.student||'익명',score:s.result.correct,readMs:Math.round(s.readMs),quizMs:Math.round(s.quizMs),
  incorrect:s.result.wrong.map(q=>q.id),skills:s.result.skill.map(x=>({...x})),
  review:s.reviewSummary?{...s.reviewSummary}:null,
  cameraSummary:frames?{postureObservedPercent:faceGood,calibrationGrade:cam.calibration?.grade||'none',paragraphAnalysisAvailable:!!evidence}:null};
}
function storeHistory(){
 if(!s.save||!s.result)return false;
 try{const old=getHistory();const entry=historyEntry();const idx=old.findIndex(x=>x.sessionId===entry.sessionId);
  if(idx>=0){entry.date=old[idx].date;old.splice(idx,1,entry);}else old.unshift(entry);
  localStorage.setItem('readinggyeol_history',JSON.stringify(old.slice(0,40)));
  return true;
 }catch{say('학습 기록을 저장하지 못했습니다. 브라우저 저장소 설정을 확인하세요.');return false;}

function startAdaptiveReview(){
 const used=new Set(s.questions.map(q=>q.id));const pool=s.passage.questions.filter(q=>!used.has(q.id));
 const wrongSkills=[...new Set(s.result.wrong.map(q=>q.skill))];
 let picked=[];
 for(const skill of wrongSkills){const a=shuffle(pool.filter(q=>q.skill===skill&&!picked.includes(q)));if(a.length)picked.push(a[0]);if(picked.length===3)break;}

 if(!picked.length){say('추가로 연습할 문제가 없습니다.');return;}

function growthChart(records){

function growthSkills(records){

<script>
/* 브라우저 기본 우클릭 메뉴와 실수로 생기는 드래그/선택 표시만 차단.
   텍스트 입력칸이 추가되어도 선택·복사·붙여넣기는 유지. */
(()=>{
  const editable = target => target instanceof Element && !!target.closest('textarea, [contenteditable], input:not([type="radio"]):not([type="checkbox"])');
  document.addEventListener('contextmenu', event => {
    if (!editable(event.target)) event.preventDefault();
  }, {capture:true});
  document.addEventListener('selectstart', event => {
    if (!editable(event.target)) event.preventDefault();
  }, {capture:true});
  document.addEventListener('dragstart', event => {
    if (!editable(event.target)) event.preventDefault();
  }, {capture:true});
})();
</script>
